<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>2028考研11408备考工作台</title>
  <!-- auto-deploy-token: push enabled -->
  <style>
:root {
  --bg: #E7E8E4;
  --surface: #FFFFFF;
  --surface-2: #F2F3F1;
  --surface-3: #D3DFF2;
  --border: #B1B2AE;
  --border-strong: #93A4C1;
  --text: #18202B;
  --text-2: #3A4452;
  --muted: #7B838F;
  --accent: #93A4C1;
  --accent-soft: #D3DFF2;
  --ink: #18202B;
  --danger: #B14B5E;
  --ok: #18202B;
  --shadow: 0 1px 3px rgba(24, 32, 43, .08), 0 6px 20px rgba(24, 32, 43, .06);
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  letter-spacing: .1px;
}
button { font-family: inherit; cursor: pointer; }

#app { display: flex; height: 100vh; width: 100vw; }

/* ---------- sidebar ---------- */
#sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 16px 12px 72px 12px; gap: 2px; overflow-y: auto;
  flex: 0 0 248px; width: 248px;
  /* 底部留出 72px，避免被固定左下角的番茄钟面板遮挡「备份/设置」 */
}
.side-brand {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 6px 8px 16px; cursor: pointer; user-select: none;
  color: var(--ink);
}
.side-brand:hover { opacity: .85; }
.side-brand .brand-ico {
  width: 28px; height: 28px; border-radius: 7px;
  background: linear-gradient(135deg, #7C92B4, #5B7290);
  color: #fff; display: grid; place-items: center;
  font-size: 13px; font-weight: 700; flex: 0 0 28px;
  box-shadow: 0 2px 6px rgba(91,114,144,.22);
}
.side-brand b { font-size: 15px; letter-spacing: .3px; }
.side-toggle { display: none; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px; border-radius: 9px; color: var(--text-2);
  border: none; background: transparent; width: 100%; text-align: left; font-size: 13.5px;
  transition: background .15s, color .15s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.nav-item .ico { width: 18px; text-align: center; opacity: .85; font-size: 14px; }
.side-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
.side-foot .nav-item { font-size: 12.5px; color: var(--muted); }

/* ---------- sidebar collapse ---------- */
#app.nav-collapsed #sidebar { flex: 0 0 70px; width: 70px; }
#app.nav-collapsed .side-brand { justify-content: center; padding: 4px 0 16px; }
#app.nav-collapsed .side-brand b { display: none; }
#app.nav-collapsed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
#app.nav-collapsed .nav-item span:not(.ico) { display: none; }
#app.nav-collapsed .side-foot .nav-item { justify-content: center; }
.side-toggle { margin-bottom: 6px; color: var(--muted); }
.side-toggle .ico { font-weight: 700; }

/* ---------- main ---------- */
#main { display: flex; flex-direction: column; min-width: 0; flex: 1; width: 0; }
#topbar {
  height: 58px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.7);
  backdrop-filter: saturate(180%) blur(12px);
  display: flex; align-items: center; justify-content: space-between; padding: 0 24px; gap: 16px;
}
.top-title { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
.top-right { display: flex; align-items: center; gap: 14px; }
.countdown {
  background: var(--accent-soft); color: var(--ink); font-weight: 700;
  padding: 6px 14px; border-radius: 999px; font-size: 13px;
}
.countdown b { font-size: 15px; }
.phase-badge {
  padding: 6px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: var(--accent-soft); color: var(--ink); border: 1px solid var(--accent);
}
#content { padding: 26px 30px 64px; overflow-y: auto; flex: 1; }

/* ---------- generic ---------- */
.page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; gap: 12px; }
.page-head h2 { margin: 0; font-size: 21px; letter-spacing: .3px; }
.page-head .sub { color: var(--muted); font-size: 12.5px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 18px;
}
.card h3 { margin: 0 0 12px; font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
.card h3 .tag { font-size: 11px; color: var(--muted); font-weight: 500; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-5 { grid-template-columns: repeat(5, 1fr); }
@media (max-width: 1180px) { .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-5 { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 720px) { .grid-2, .grid-3, .grid-4, .grid-5 { grid-template-columns: 1fr; } }

.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 15px 17px; box-shadow: var(--shadow);
}
.stat .label { color: var(--muted); font-size: 12px; }
.stat .value { font-size: 24px; font-weight: 700; margin-top: 5px; letter-spacing: .3px; }
.stat .value small { font-size: 13px; color: var(--text-2); font-weight: 500; }

.btn {
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  padding: 8px 14px; border-radius: 9px; font-size: 13px; transition: filter .15s, background .15s;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { filter: brightness(1.15); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); }

label.field { display: block; margin-bottom: 10px; }
label.field > span { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 5px; }
input, textarea, select {
  width: 100%; font-family: inherit; font-size: 13.5px; color: var(--text);
  border: 1px solid var(--border-strong); border-radius: 9px; padding: 8px 10px; background: var(--surface);
}
textarea { resize: vertical; min-height: 64px; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 9px 11px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-2); font-weight: 600; font-size: 12px; background: var(--surface-2); }
tr:hover td { background: var(--surface-2); }
td.actions { white-space: nowrap; }

.pill {
  display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  border: 1px solid transparent; background: var(--surface-2); color: var(--text-2);
}
.pill.s { color: #fff; }
.pill.sm { padding: 1px 8px; font-size: 11px; }

.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

/* mastery levels */
.mastery { display: inline-flex; gap: 3px; align-items: center; }
.mastery .m { width: 11px; height: 11px; border-radius: 3px; background: var(--border); }
.mastery .m.on { background: var(--accent); }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; transition: border-color .15s, color .15s; }

.list-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
.list-row:last-child { border-bottom: none; }
.list-row.tight { padding: 7px 2px; font-size: 13px; }

.check { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--border-strong); flex: 0 0 auto; margin-top: 1px; display: grid; place-items: center; color: #fff; font-size: 11px; cursor: pointer; transition: background .15s, border-color .15s; }
.check.done { background: var(--ok); border-color: var(--ok); }

.empty { color: var(--muted); font-size: 13px; padding: 16px 2px; text-align: center; }

/* plan board / phase */
.board { }
.phase { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 13px; transition: border-color .15s, box-shadow .15s; }
.phase.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.phase-name { font-weight: 700; font-size: 13.5px; }
.mini { font-size: 12px; color: var(--muted); }
.goals { font-size: 13px; padding: 8px 0 2px; margin-top: 6px; border-top: 1px dashed var(--border); cursor: pointer; white-space: pre-wrap; }

/* modal */
#modal-layer { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal-mask { position: absolute; inset: 0; background: rgba(24, 32, 43, .32); backdrop-filter: blur(2px); }
.modal {
  position: relative; width: min(640px, 92vw); max-height: 86vh; overflow-y: auto;
  background: var(--surface); border-radius: 18px; box-shadow: 0 24px 70px rgba(24,32,43,.28); padding: 24px 26px;
}
.modal h3 { margin: 0 0 16px; font-size: 17px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

/* toast */
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 99; }
.toast-item { background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); }

.muted { color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hr { height: 1px; background: var(--border); margin: 14px 0; }

/* heatmap */
.heat { overflow-x: auto; }
.heat-weeks { display: flex; gap: 3px; }
.heat-week { display: flex; flex-direction: column; gap: 3px; }
.heat-cell { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--border); }
.heat-cell.l0 { background: #E7E8E4; }
.heat-cell.l1 { background: #D3DFF2; border-color: #D3DFF2; }
.heat-cell.l2 { background: #93A4C1; border-color: #93A4C1; }
.heat-cell.l3 { background: #18202B; border-color: #18202B; }
.heat-legend { display: flex; align-items: center; gap: 4px; margin-top: 10px; font-size: 11px; }
.heat-legend .heat-cell { width: 11px; height: 11px; }
pre.box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.6; }
.sec-title { font-size: 13px; font-weight: 700; color: var(--text-2); margin: 4px 0 10px; letter-spacing: .4px; }

/* pomodoro timer widget */
.pomo { position: fixed; left: 18px; bottom: 18px; width: 264px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 34px rgba(24,32,43,.2); z-index: 60; overflow: hidden; font-size: 13px; }
.pomo.collapsed { width: auto; min-width: 110px; }
.pomo.collapsed .pomo-body { display: none; }
.pomo-head { display: flex; align-items: center; gap: 8px; padding: 11px 14px; cursor: pointer; border-bottom: 1px solid var(--border); font-weight: 600; color: var(--ink); }
.pomo.collapsed .pomo-head { justify-content: center; border-bottom: none; padding: 10px 16px; }
.pomo.collapsed .pomo-collapse { display: none; }
.pomo-ico { font-size: 15px; }
.pomo-collapse { margin-left: auto; color: var(--muted); font-weight: 700; font-size: 14px; }
.pomo-body { padding: 14px; display: flex; flex-direction: column; gap: 11px; }
.pomo-modes { display: flex; gap: 8px; }
.pomo-mode { flex: 1; padding: 7px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text-2); font-size: 12.5px; transition: all .15s; }
.pomo-mode.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.pomo-focus { display: flex; align-items: center; gap: 8px; }
.pomo-focus select { flex: 1; }
.pomo-time-wrap { position: relative; height: 54px; display: flex; align-items: center; justify-content: center; }
.pomo-time { font-size: 36px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: 2px; color: var(--ink); cursor: pointer; border-radius: 10px; padding: 4px 12px; }
.pomo-time:hover { background: var(--surface-2); }
.pomo-time-input { display: none; width: 120px; font-size: 28px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; padding: 6px 8px; border: 2px solid var(--accent); border-radius: 10px; background: var(--surface); color: var(--ink); outline: none; }
.pomo-ctl { display: flex; gap: 8px; }
.pomo-ctl .btn { flex: 1; }
.pomo-hint { font-size: 11.5px; color: var(--muted); text-align: center; }

/* radar chart */
.radar-cell svg { display: block; margin: 0 auto; }
.radar-cell text { font-family: var(--font); }

/* dashboard enhancements */
.dash-phase { font-size: 13px; color: var(--text-2); font-weight: 600; }
.dash-goal { font-size: 12px; color: var(--muted); margin-top: 2px; }
.suggest-row { display: flex; align-items: center; gap: 8px; padding: 6px 2px; border-bottom: 1px solid var(--border); }
.suggest-row:last-child { border-bottom: none; }

/* 每日必做（反馈1：瓦片式，适配现配色） */
.daily-must .dm-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 12px; }
.dm-item { border: 1px solid var(--border); border-radius: 12px; padding: 14px 8px; text-align: center; background: var(--surface-2); transition: background .15s, border-color .15s, transform .1s; }
.dm-item:active { transform: scale(.97); }
.dm-item.done { background: var(--accent-soft); border-color: var(--border-strong); }
.dm-ico { width: 30px; height: 30px; border-radius: 50%; margin: 0 auto 8px; display: grid; place-items: center; border: 2px solid var(--border); color: var(--muted); font-size: 14px; font-weight: 700; }
.dm-item.done .dm-ico { background: var(--accent); border-color: var(--accent); color: #fff; }
.dm-name { font-size: 13.5px; font-weight: 600; color: var(--text); }
.dm-hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
@media (max-width: 680px) { .daily-must .dm-row { grid-template-columns: repeat(3, 1fr); } }

/* 每周习惯打卡（数据结构/高数/单词/长难句/语法 × 周一至周日） */
.habit-grid { display: grid; grid-template-columns: 58px repeat(7, 1fr); gap: 3px; margin-top: 8px; align-items: center; }
.habit-hdr { font-size: 10px; color: var(--muted); text-align: center; font-weight: 600; }
.habit-row-label { font-size: 11px; font-weight: 600; color: var(--text-2); }
.habit-cell { height: 22px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--border); cursor: pointer; transition: background .15s, border-color .15s, transform .08s; }
.habit-cell:hover { border-color: var(--border-strong); }
.habit-cell:active { transform: scale(.94); }
.habit-cell.on { background: var(--accent); border-color: var(--accent); }

/* 首页各大板块之间的纵向间距 */
.dash-stack { display: flex; flex-direction: column; gap: 14px; width: 100%; }

/* 学习出勤 · 本月日历式打卡（迷你，与左侧对齐） */
.month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 4px; max-width: 220px; }
.mh-hdr { font-size: 8px; color: var(--muted); text-align: center; font-weight: 600; margin-bottom: 1px; }
.mh-cell { position: relative; aspect-ratio: 1 / 1; min-height: 12px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; font-size: 8px; color: var(--muted); }
.mh-cell.empty { background: transparent; border: none; }
.mh-cell.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.mh-cell.future { opacity: .35; cursor: default; }
/* 首页左右两大栏等高对齐 */
.dash-col { display: flex; flex-direction: column; gap: 14px; }
.dash-col > .card { flex: 1; }

/* ---------- mobile responsive ---------- */
#mobile-menu-btn { display: none; }
@media (max-width: 560px) {
  body { font-size: 15px; }
  #app { display: block; }
  #sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 260px; z-index: 60;
    transform: translateX(-100%); transition: transform .22s ease;
    box-shadow: 4px 0 24px rgba(24,32,43,.18); padding-bottom: 90px;
    flex: none;
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar-overlay {
    position: fixed; inset: 0; background: rgba(24,32,43,.35); z-index: 55;
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  #sidebar-overlay.show { opacity: 1; pointer-events: auto; }
  #mobile-menu-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface); font-size: 18px; margin-right: 10px; flex: 0 0 auto;
  }
  #topbar { padding: 0 14px; height: 54px; }
  .top-title { font-size: 15px; display: flex; align-items: center; }
  #content { padding: 16px 14px 80px; }
  .card { padding: 14px 15px; border-radius: 12px; }
  .modal { width: 94vw; padding: 18px 16px; border-radius: 16px; }
  #app.nav-collapsed #sidebar { width: 260px; flex: none; }
  .side-toggle { display: none; }
}

</style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-brand" id="side-brand" title="折叠 / 展开侧栏">
        <div class="brand-ico">408</div>
        <b>备考工作台</b>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <button class="nav-item" id="nav-backup"><span class="ico">⚙</span> 备份 / 设置</button>
      </div>
    </aside>
    <div id="sidebar-overlay"></div>
    <main id="main">
      <header id="topbar">
        <div class="top-title" id="top-title"><button id="mobile-menu-btn" aria-label="打开菜单">☰</button><span id="top-title-text">首页</span></div>

          <span class="countdown" id="countdown">距初试 — 天</span>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>
  <div id="toast"></div>

window.APP = window.APP || {};

      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    },
    parse(s) {
      if (!s) return null;
      const [y, m, d] = s.split('-').map(Number);
      return new Date(y, m - 1, d);
    },
    addDays(s, n) {
      const d = this.parse(s);
      d.setDate(d.getDate() + n);
      return this.fmt(d);
    },
    daysBetween(a, b) {
      const da = this.parse(a), db = this.parse(b);
      return Math.round((db - da) / 86400000);
    },
    weekStart(s) {
      const d = this.parse(s);
      const day = (d.getDay() + 6) % 7; // Monday=0
      d.setDate(d.getDate() - day);
      return this.fmt(d);
    },
    monthKey(s) {
      return s.slice(0, 7);

  };

    const o = {};
    APP.BOARDS.forEach(b => { o[b] = {}; (APP.ABILITY_DIMS[b] || []).forEach(d => o[b][d] = 0); });
    return o;
  }
  function seedPolitics() {
    const subs = ['马克思主义基本原理', '毛中特', '中国近现代史纲要', '思想道德与法治', '时事政治'];
    const o = { subjects: subs, progress: {}, notes: {}, checkins: {}, practice: [] };
    subs.forEach(s => { o.progress[s] = 0; o.notes[s] = ''; o.checkins[s] = []; });
    return o;
  }
  function seedRealExams() {
    const arr = [];
    for (let y = 2009; y <= 2027; y++) {
      arr.push({ id: uid(), year: y, type: '真题', knowledge: '', errors: '', score: '', isMock: false });
    }
    return arr;
  }
  function seedPlan() {
    const plan = {};
    APP.BOARDS.forEach(b => {
      plan[b] = APP.PHASES.map((p, i) => {
        const d = (DEFAULT_DATES[b] || [])[i] || {};
        const tasks = p.key === 'base'
          ? (APP.DEFAULT_BASE_TASKS[b] || []).map(t => ({ id: uid(), text: t, done: false }))
          : [];
        return { key: p.key, name: p.name, start: d.start || '', end: d.end || '', goals: '', tasks, tasksInit: p.key === 'base' };
      });
    });
    return plan;
  }
  function seed() {
    return {
      meta: { name: '2028考研11408备考工作台', examDate: '2027-12-18', startDate: '2026-07-01' },
      plan: seedPlan(),
      todayTasks: {},
      studyLog: {},
      knowledge: seedKnowledge(),
      math: seedMath(),
      mathKnowledge: (() => { const o = {}; ['高等数学', '线性代数', '概率论'].forEach(c => { o[c] = (MATH_CHAPTERS[c] || []).map(ch => (ch.outline || []).map(o2 => ({ id: uid(), name: o2, chapter: ch.chapter, importance: 3, mastery: 0, notes: '' }))).flat(); }); return o; })(),
      english: { words: {}, wordRecords: {}, grammar: [], sentences: [], reading: [], cloze: [], translation: [], newtype: [], writing: { templates: [], materials: [], practice: [] }, exams: [], ability: { 词汇: 0, 阅读: 0, 写作: 0, 翻译: 0, 完形: 0, 新题型: 0 } },
      wrongQuestions: [],
      realExams: seedRealExams(),
      politics: seedPolitics(),
      reviews: { weekly: [], monthly: [] },
      ability: seedAbility(),
      weekTypeOverride: {},
      dailyPractice: [],
      monthlyTasks: [],
      todayReviewed: {},
      settings: { webdav: { url: 'https://dav.jianguoyun.com/dav/', user: '', pass: '', enabled: false, lastSync: '', lastSyncStatus: '' } }
    };
  }

  // ---------- persistence ----------
  const KEY = 'yutian_408_workbench_v1';
  let state = null;

  // 数据迁移：旧数据补充缺失字段 + 章节名映射
  function migrate(oldState) {
    const fresh = seed();
    // 1. 补充顶层缺失字段
    ['plan','knowledge','math','mathKnowledge','english','ability','politics','wrongQuestions','realExams','reviews','todayTasks','studyLog','meta','settings','monthlyTasks','habitLog','todayReviewed'].forEach(k => {
      if (oldState[k] === undefined) oldState[k] = fresh[k];
    });
    if (!oldState.mathKnowledge) oldState.mathKnowledge = {};
    ['高等数学','线性代数','概率论'].forEach(c => {
      if (!oldState.mathKnowledge[c]) oldState.mathKnowledge[c] = [];
      // 科目无知识点但章节已有课程目录时，把每章 outline 自动填充为知识点
      if (!oldState.mathKnowledge[c].length && oldState.math && oldState.math[c] && Array.isArray(oldState.math[c])) {
        oldState.mathKnowledge[c] = oldState.math[c].map(ch => (ch.outline || []).map(o2 => ({ id: uid(), name: o2, chapter: ch.chapter, importance: 3, mastery: 0, notes: '' }))).flat();
      }
    });
    // 2. 迁移 knowledge 的 chapter 字段（旧名 → 新名）
    const CHAPTER_MAP = {
      '数据结构': {
        '绪论': '第1章 绪论', '线性表': '第2章 线性表', '栈和队列': '第3章 栈和队列',
        '串': '第4章 串', '树与二叉树': '第6章 树与二叉树', '图': '第7章 图',
        '查找': '第8章 查找', '排序': '第9章 排序'
      },
      '计算机组成原理': {
        '计算机系统概述': '第1章 概述', '数据的表示和运算': '第2章 数据的表示和运算',
        '存储系统': '第3章 存储器层次结构', '指令系统': '第4章 指令系统',
        '中央处理器': '第5章 中央处理器', '总线': '第6章 总线和IO系统',
        '输入输出系统': '第6章 总线和IO系统'
      },
      '操作系统': {
        '操作系统概述': '第1讲 操作系统基础', '进程管理': '第2讲 进程管理',
        '内存管理': '第3讲 存储器管理', '文件管理': '第4讲 文件管理',
        '设备管理': '第5讲 输入输出管理'
      },
      '计算机网络': {
        '计算机网络体系结构': '第1讲 计算机网络体系结构', '物理层': '第2讲 物理层',
        '数据链路层': '第3讲 数据链路层', '网络层': '第4讲 网络层',
        '传输层': '第5讲 传输层', '应用层': '第6讲 应用层'
      }
    };
    Object.keys(CHAPTER_MAP).forEach(subj => {
      const pts = oldState.knowledge[subj];
      if (!pts) return;
      pts.forEach(p => {
        if (p.chapter && CHAPTER_MAP[subj][p.chapter]) {
          p.chapter = CHAPTER_MAP[subj][p.chapter];
        }
      });
    });
    // 3. 一次性迁移 plan 阶段日期到新时间线（仅当该阶段无任务被勾选，避免覆盖手改）
    if (!oldState._planDateMigrated) {
      let changed = false;
      APP.BOARDS.forEach(b => {
        const phases = oldState.plan[b];
        const defs = DEFAULT_DATES[b] || [];
        if (!phases) return;
        phases.forEach((p, i) => {
          const def = defs[i];
          if (!def) return;
          const hasChecked = (p.tasks || []).some(t => t.done);
          const dateChanged = (p.start !== def.start) || (p.end !== def.end);
          if (dateChanged && !hasChecked) {
            p.start = def.start;
            p.end = def.end;
            changed = true;
          }
        });
      });
      if (changed) oldState._planDateMigrated = true;
    }
    // 4. 初试日期：确保存在；修正误存的 2027-12-25 → 官方 2027-12-18（仅针对该确切旧值，不覆盖用户手设的其他日期）
    if (oldState.meta) {
      if (!oldState.meta.examDate) oldState.meta.examDate = '2027-12-18';
      else if (oldState.meta.examDate === '2027-12-25') oldState.meta.examDate = '2027-12-18';
    }
    // 5. 高数章节：若 高等数学 为未动过的种子默认（全部进度0且≤9章），替换为张宇十八讲规划（有真实进度的保留，不覆盖）
    if (!oldState._mathLecturesMigrated && oldState.math && oldState.math['高等数学']) {
      const hm = oldState.math['高等数学'];
      const untouched = hm.length <= 9 && hm.every(c => !(Number(c.progress) > 0));
      if (untouched) {
        oldState.math['高等数学'] = MATH_CHAPTERS['高等数学'].map(cfg => ({ id: uid(), chapter: cfg.chapter, targetWeek: cfg.targetWeek, outline: cfg.outline || [], progress: 0, formulas: '', typical: '', wrong: '', secondPass: '' }));
        oldState._mathLecturesMigrated = true;
      }
    }
    // 8. 数学章节升级：补充 outline 字段；线代/概率的旧短章节名升级为“第x讲”形式（保留进度、笔记）
    if (!oldState._mathOutlineMigrated && oldState.math) {
      Object.keys(MATH_CHAPTERS).forEach(course => {
        const cfgList = MATH_CHAPTERS[course];
        const oldList = oldState.math[course] || [];
        // 按 chapter 名建立新配置映射
        const cfgMap = {};
        cfgList.forEach(cfg => { cfgMap[cfg.chapter] = cfg; });
        // 旧章节名 → 新章节名映射（仅线代/概率短名称）
        const nameMap = {};
        if (course === '线性代数') {
          ['行列式','矩阵','向量组的线性相关','线性方程组','特征值与特征向量','二次型'].forEach((old, i) => { nameMap[old] = cfgList[i] ? cfgList[i].chapter : old; });
        }
        if (course === '概率论') {
          ['随机事件与概率','随机变量及其分布','多维随机变量','数字特征','大数定律与中心极限','参数估计','假设检验'].forEach((old, i) => { nameMap[old] = cfgList[i] ? cfgList[i].chapter : old; });
        }
        const newList = [];
        oldList.forEach(old => {
          const chapterName = nameMap[old.chapter] || old.chapter;
          const cfg = cfgMap[chapterName];
          const item = { ...old, chapter: chapterName };
          if (cfg && !item.outline) item.outline = cfg.outline || [];
          else if (!item.outline) item.outline = [];
          newList.push(item);
        });
        oldState.math[course] = newList;
      });
      oldState._mathOutlineMigrated = true;
    }
    // 6. 数学章节进度按打卡自动判定（仅首次，避免覆盖后续手动微调）
    if (!oldState._mathAutoAssessed) {
      APP.autoAssessMath(oldState);
      oldState._mathAutoAssessed = true;
    }
    // 7. 真题记录补 board/pass/正确率（旧数据无分区，默认归 408 / 一刷；score 形如 120/150 解析为 correct/total）
    (oldState.realExams || []).forEach(e => {
      if (!e.board) e.board = '408';
      if (!e.pass) e.pass = '一刷';
      if (e.score && !e.total) {
        const mm = String(e.score).match(/(\d+)\s*\/\s*(\d+)/);
        if (mm) { e.correct = Number(mm[1]); e.total = Number(mm[2]); }
      }
    });
    // 9. 补充每日刷题记录字段
    if (!oldState.dailyPractice) oldState.dailyPractice = [];
    // 10. 补充本月任务字段
    if (!oldState.monthlyTasks) oldState.monthlyTasks = [];
    // 11. 补充英语单词默写掌握记录字段
    if (oldState.english && oldState.english.wordRecords === undefined) oldState.english.wordRecords = {};
    // 12. 补充 WebDAV 配置字段
    oldState.settings = oldState.settings || {};
    const wv = oldState.settings.webdav;
    if (!wv || typeof wv !== 'object') oldState.settings.webdav = { url: 'https://dav.jianguoyun.com/dav/', user: '', pass: '', enabled: false, lastSync: '', lastSyncStatus: '' };
    else {
      if (wv.url === undefined) wv.url = 'https://dav.jianguoyun.com/dav/';
      if (wv.user === undefined) wv.user = '';
      if (wv.pass === undefined) wv.pass = '';
      if (wv.enabled === undefined) wv.enabled = false;
      if (wv.lastSync === undefined) wv.lastSync = '';
      if (wv.lastSyncStatus === undefined) wv.lastSyncStatus = '';
    }
    return oldState;
  }

  // 计算一组刷题记录的章节正确率：按 (subject, chapter) 聚合
  APP.chapterAccuracy = function (records) {
    const map = {};
    (records || []).forEach(r => {
      const key = (r.subject || '其他') + '::' + (r.chapter || '未分类');
      if (!map[key]) map[key] = { subject: r.subject || '其他', chapter: r.chapter || '未分类', total: 0, correct: 0 };
      map[key].total += Number(r.total) || 0;
      map[key].correct += Number(r.correct) || 0;
    });
    return Object.values(map).map(x => ({ ...x, accuracy: x.total > 0 ? Math.round(x.correct / x.total * 100) : 0 }));
  };

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        state = JSON.parse(raw);
        state = migrate(state);
        save();
        return;
      }
    } catch (e) { /* ignore */ }
    if (!state) state = seed();
    save();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { console.warn('localStorage 保存失败，请用导出备份', e); }
    if (APP.syncAutoUpload) APP.syncAutoUpload();
  }
  function reset() {
    state = seed();
    save();
  }
  function exportJSON() {
    return JSON.stringify(state, null, 2);
  }
  function importJSON(str) {
    const data = JSON.parse(str);
    state = data;
    save();
  }

  APP.store = {
    get: () => state,
    save, load, reset, exportJSON, importJSON, uid
  };

  // 大小周推算：基准 2026-08-03 = 大周（双休）；支持按周手动覆盖（state.weekTypeOverride[周一]）
  APP.weekTypeFor = function (d) {
    const ws = APP.util.weekStart(d);
    const ov = (state.weekTypeOverride || {})[ws];
    if (ov === '大周' || ov === '小周') return ov;
    const ref = APP.util.weekStart('2026-08-03');
    const diff = Math.round((new Date(ws) - new Date(ref)) / (7 * 864e5));
    return (diff % 2 === 0) ? '大周' : '小周';
  };
  // 数学章节进度按打卡自动判定：依据建议周次(targetWeek)与 studyLog 的数学打卡
  // 基准：W1 周一 = 2026-08-03（与 weekTypeFor 基准一致）；只判定有 targetWeek 的章节
  APP.autoAssessMath = function (st) {
    if (!st || !st.math) return;
    const U = APP.util;
    const W1 = '2026-08-03';
    const today = U.todayStr();
    Object.keys(st.math).forEach(course => {
      (st.math[course] || []).forEach(ch => {
        if (!ch.targetWeek) return;
        const m = (ch.targetWeek.match(/W(\d+)/) || [])[1];
        if (!m) return;
        const n = parseInt(m, 10);
        const dueMonday = U.addDays(W1, (n - 1) * 7);
        if (dueMonday > today) return; // 未来周次不判定
        // 该章所在周窗口内（dueMonday ~ dueMonday+6）是否有数学打卡
        let studied = false, d = dueMonday;
        const weekEnd = U.addDays(dueMonday, 6);
        while (d <= weekEnd && d <= today) {
          const l = st.studyLog[d];
          const sm = l && l.subjectMin;
          if ((sm && Number(sm.math) > 0) || (l && Number(l.mathDone) > 0)) studied = true;
          d = U.addDays(d, 1);
        }
        const newP = studied ? 100 : 0;
        if (Number(ch.progress || 0) !== newP) {
          ch.progressLog = ch.progressLog || [];
          ch.progressLog.push({ date: today, value: newP });
          if (ch.progressLog.length > 20) ch.progressLog = ch.progressLog.slice(-20);
          ch.progress = newP;
        }
      });
    });
  };

  // 408 知识点掌握度按刷题记录自动判定：按 chapter 匹配 dailyPractice，准确率达标则提升掌握度
  APP.autoAssess408 = function (st) {
    if (!st || !st.knowledge) return;
    const acc = APP.chapterAccuracy((st.dailyPractice || []).filter(r => r.subject === '408'));
    acc.forEach(a => {
      if (a.total < 3) return;
      APP.KNOWLEDGE_SUBJECTS.forEach(subj => {
        (st.knowledge[subj] || []).forEach(p => {
          if (p.chapter !== a.chapter) return;
          if (p.manualMastery) return; // 用户手动设过，不再被自动覆盖
          let target = p.mastery || 0;
          if (a.accuracy >= 80) target = Math.max(target, 4);
          else if (a.accuracy >= 60) target = Math.max(target, 3);
          else if (a.accuracy >= 40) target = Math.max(target, 2);
          else target = Math.max(target, 1);
          if (target !== p.mastery) p.mastery = target;
        });
      });
    });
  };

  // 根据刷题正确率、章节进度、错题掌握度等自动计算能力雷达各维度得分（0-5）
  APP.computeAbility = function (st) {
    if (!st) return;
    st.ability = st.ability || {};
    const dp = st.dailyPractice || [];

    // 数学一：知识体系 / 计算能力 / 真题能力
    const mathChs = Object.values(st.math || {}).flat();
    const mathProgress = mathChs.length ? mathChs.reduce((s, c) => s + (Number(c.progress) || 0), 0) / mathChs.length : 0;
    const mathDp = dp.filter(r => r.subject === '数学一');
    const mathTotal = mathDp.reduce((s, r) => s + (Number(r.total) || 0), 0);
    const mathCorrect = mathDp.reduce((s, r) => s + (Number(r.correct) || 0), 0);
    const mathAcc = mathTotal > 0 ? mathCorrect / mathTotal : 0;
    const mathExams = (st.realExams || []).filter(e => e.board === '数学一' && Number(e.total) > 0);
    const mathExamAcc = mathExams.length ? mathExams.reduce((s, e) => s + (Number(e.correct) || 0) / Number(e.total), 0) / mathExams.length : 0;
    st.ability['数学一'] = {
      '知识体系': Math.min(5, Math.round(mathProgress / 20 * 10) / 10),
      '计算能力': Math.min(5, Math.round(mathAcc * 5 * 10) / 10),
      '真题能力': Math.min(5, Math.round(mathExamAcc * 5 * 10) / 10)
    };

    // 408：数据结构 / 计组 / OS / 网络
    const subs = APP.KNOWLEDGE_SUBJECTS || [];
    const dims = APP.ABILITY_DIMS['408'] || subs;
    const dimMap = {
      '数据结构': '数据结构',
      '计组': '计算机组成原理',
      '操作系统': '操作系统',
      '网络': '计算机网络'
    };
    const dp408 = dp.filter(r => r.subject === '408');
    st.ability['408'] = {};
    dims.forEach((dim, idx) => {
      const subj = dimMap[dim] || subs[idx];
      if (!subj) return;
      const pts = (st.knowledge[subj] || []).filter(p => Number(p.importance) >= 3);
      const knowAvg = pts.length ? pts.reduce((s, p) => s + (Number(p.mastery) || 0), 0) / pts.length : 0;
      // 同科目 chapter 的刷题正确率
      const subAcc = APP.chapterAccuracy(dp408).filter(a => {
        const chSubj = Object.keys(APP.KNOWLEDGE_CHAPTERS || {}).find(k => (APP.KNOWLEDGE_CHAPTERS[k] || []).includes(a.chapter));
        return chSubj === subj;
      });
      const subTotal = subAcc.reduce((s, a) => s + a.total, 0);
      const subCorrect = subAcc.reduce((s, a) => s + a.correct, 0);
      const acc = subTotal > 0 ? subCorrect / subTotal : 0;
      const score = Math.min(5, Math.round((knowAvg * 0.6 + acc * 5 * 0.4) * 10) / 10);
      st.ability['408'][dim] = score;
    });

    // 英语一：词汇 / 语法 / 阅读 / 作文（词汇维度同时计入打卡新词，随打卡精准变动）
    const eng = st.english || {};
    const wordTotal = Object.values(eng.words || {}).reduce((s, a) => s + (a || []).length, 0);
    let wordNewTotal = 0;
    for (const d in (st.studyLog || {})) wordNewTotal += Number(st.studyLog[d].wordNew) || 0;
    const vocabFromCheckin = Math.min(5, Math.round(wordNewTotal / 1800 * 5 * 10) / 10);
    const vocabScore = Math.max(vocabFromCheckin, Math.min(5, Math.round(wordTotal / 5500 * 5 * 10) / 10));
    const grammarScore = Math.min(5, Math.round((eng.grammar || []).length / 20 * 5 * 10) / 10);
    const engDp = dp.filter(r => r.subject === '英语一');
    const engTotal = engDp.reduce((s, r) => s + (Number(r.total) || 0), 0);
    const engCorrect = engDp.reduce((s, r) => s + (Number(r.correct) || 0), 0);
    const engAcc = engTotal > 0 ? engCorrect / engTotal : 0;
    const readingScore = Math.min(5, Math.round(engAcc * 5 * 10) / 10);
    const writingScore = Math.min(5, Math.round(((eng.writing?.practice || []).length / 15 * 5 * 10) / 10));
    st.ability['英语一'] = {
      '词汇': vocabScore,
      '语法': grammarScore,
      '阅读': readingScore,
      '作文': writingScore
    };

    // 政治：知识掌握
    const pol = st.politics || {};
    const polSubs = pol.subjects || [];
    const polProg = polSubs.length ? polSubs.reduce((s, sub) => s + (Number(pol.progress?.[sub]) || 0), 0) / polSubs.length : 0;
    st.ability['政治'] = { '知识掌握': Math.min(5, Math.round(polProg / 20 * 10) / 10) };
  };

  // 当前薄弱点收集（dashboard / review 复用）
  APP.collectWeakPoints = function (st) {
    const points = [];
    // 1. 408 知识点掌握度
    const subs = APP.KNOWLEDGE_SUBJECTS || ['数据结构','计算机组成原理','操作系统','计算机网络'];
    subs.forEach(s => {
      const pts = (st.knowledge[s] || []).filter(p => p.mastery < 3 && p.importance >= 4);
      pts.slice(0, 2).forEach(p => points.push({ subject: '408', text: s + ' · ' + p.name, level: '掌握弱', below: true }));
    });
    // 2. 数学进度慢
    Object.values(st.math || {}).flat().forEach(c => {
      if ((c.progress || 0) < 60) points.push({ subject: '数学一', text: c.chapter, level: '进度慢' });
    });
    // 3. 英语能力
    const engAb = st.english?.ability || {};
    Object.entries(engAb).forEach(([k, v]) => { if ((v || 0) < 3) points.push({ subject: '英语一', text: k, level: '能力弱' }); });
    // 4. 政治进度
    const pol = st.politics;
    if (pol && pol.subjects) {
      pol.subjects.forEach(s => { if ((pol.progress[s] || 0) < 40) points.push({ subject: '政治', text: s, level: '进度慢' }); });
    }
    // 5. 错题库中未掌握
    (st.wrongQuestions || []).filter(q => q.mastery < 3).slice(0, 4).forEach(q => {
      points.push({ subject: q.subject || '408', text: (q.title || '').slice(0, 28) || '未命名错题', level: '未掌握' });
    });

    const node = document.createElement(tag);

        const v = attrs[k];
        if (k === 'class') node.className = v;
        else if (k === 'text') textVal = v;
        else if (k === 'html') htmlVal = v;
        else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
        else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v);

  // 基于当前阶段、章节进度，按科目顺序推荐当前正在学的下一任务（不并行多本/多科）
  function recommendUnstudiedChapters(st) {
    const recs = [];
    const wk = currentWeekNum();
    // 数学：按 高数→线代→概率论 顺序，只推荐当前正在学的第一门未完成课程
    const mathCourses = ['高等数学', '线性代数', '概率论'];
    for (const course of mathCourses) {
      const chapters = st.math[course] || [];
      const due = chapters
        .map(c => ({ c, wn: parseWeekNum(c.targetWeek) }))
        .filter(x => x.wn != null && x.wn <= wk + 1 && (Number(x.c.progress) || 0) < 100)
        .sort((a, b) => a.wn - b.wn);
      if (due.length) {
        const x = due[0];
        recs.push({ subject: '数学一', text: course + ' · ' + x.c.chapter + '（建议' + x.c.targetWeek + '，进度' + (x.c.progress || 0) + '%）' });
        break;
      }
      const unstarted = chapters.filter(c => (Number(c.progress) || 0) < 100);
      if (unstarted.length) {
        recs.push({ subject: '数学一', text: course + ' · 推进未完成章节（剩 ' + unstarted.length + ' 章）' });
        break;
      }
    }
    // 408：按 DS→计组→OS→计网 顺序，只推荐当前正在学的第一个未学完章节
    // 判定标准：章节内存在未学（mastery === 0）知识点，才视为“还没学完”需要推荐；
    // 若所有知识点都已起步（mastery > 0），则认为该章已学过，直接推进下一章。
    const chapNo = (s) => { const m = String(s || '').match(/第\s*\d+\s*章/); return m ? m[0].replace(/\s+/g, '') : s; };
    const subjOrder = ['数据结构', '计算机组成原理', '操作系统', '计算机网络'];
    for (const subj of subjOrder) {
      const chs = APP.KNOWLEDGE_CHAPTERS[subj] || [];
      const pts = st.knowledge[subj] || [];
      let pushed = false;
      for (const ch of chs) {
        const no = chapNo(ch);
        const chPts = pts.filter(p => chapNo(p.chapter) === no);
        if (!chPts.length) {
          recs.push({ subject: '408', text: subj + ' · ' + ch + '（待补充知识点）' });
          pushed = true; break;
        }
        const unstarted = chPts.filter(p => (p.mastery || 0) === 0).length;
        if (unstarted > 0) {
          recs.push({ subject: '408', text: subj + ' · ' + ch + '（' + unstarted + ' 个知识点未学）' });
          pushed = true; break;
        }
      }
      if (pushed) break;
    }
    return recs;
  }

      suggestions.push({ subject: '英语一', text: '阅读二刷 + 完形/翻译/新题型真题 + 作文模板' });
      suggestions.push({ subject: '政治', text: '1000题二刷 + 背诵手册 + 选择题巩固' });
    }
    if (key === 'sprint') {
      suggestions.push({ subject: '数学一', text: '模拟卷 + 公式默写 + 错题复盘' });
      suggestions.push({ subject: '408', text: '真题二刷 + 模拟卷 + 查漏补缺' });
      suggestions.push({ subject: '英语一', text: '全真模拟 + 作文背诵 + 保持手感' });
      suggestions.push({ subject: '政治', text: '选择题巩固+大题背诵 + 时政' });
    }
    return suggestions.slice(0, 6);
  }
  // 各科练习掌握情况（近7天 dailyPractice + 英语词汇；4门全显，顺序 408/数学一/英语一/政治）
  function buildSubjectSummary() {
    const card = APP.el('div', { class: 'card' }, [APP.el('h3', { text: '各科练习掌握情况（近 7 天）', html: '' })]);
    const since = U.addDays(today, -6);
    const recent = (st.dailyPractice || []).filter(r => r.date >= since && r.date <= today);
    // 固定顺序：408、数学一、英语一、政治（全部呈现，未启动也显示 0%）
    ['408', '数学一', '英语一', '政治'].forEach(b => {
      if (b === '英语一') {
        let wnTotal = 0; for (const d in st.studyLog) wnTotal += Number(st.studyLog[d].wordNew) || 0;
        const vocabPct = Math.min(100, Math.round(wnTotal / 1800 * 100));
        const dueW = dueWordReviews().length;
        const eColor = vocabPct >= 80 ? '#5B7290' : vocabPct >= 50 ? '#93A4C1' : 'var(--danger)';
        card.appendChild(APP.el('div', { style: 'margin-bottom:10px' }, [
          APP.el('div', { class: 'spread', style: 'margin-bottom:4px' }, [
            APP.subjectTag(b),
            APP.el('span', { class: 'muted', style: 'font-size:12px', text: '新词 ' + wnTotal + '/1800 · 待复习 ' + dueW + ' 个' })
          ]),
          APP.el('div', { class: 'bar' }, [APP.el('i', { style: 'width:' + vocabPct + '%;background:' + eColor })])
        ]));
        return;
      }
      const rec = recent.filter(r => r.subject === b);
      const total = rec.reduce((s, r) => s + (Number(r.total) || 0), 0);
      const correct = rec.reduce((s, r) => s + (Number(r.correct) || 0), 0);
      const wrong = total - correct;
      const acc = total > 0 ? Math.round(correct / total * 100) : 0;
      const color = acc >= 80 ? '#5B7290' : acc >= 60 ? '#93A4C1' : 'var(--danger)';
      const weakChaps = total > 0 ? APP.chapterAccuracy(rec).filter(x => x.accuracy < 60 && x.total >= 5) : [];
      card.appendChild(APP.el('div', { style: 'margin-bottom:10px' }, [
        APP.el('div', { class: 'spread', style: 'margin-bottom:4px' }, [
          APP.subjectTag(b),
          APP.el('span', { class: 'muted', style: 'font-size:12px', text: total > 0 ? (correct + '/' + total + ' · 正确率 ' + acc + '% · 错题 ' + wrong) : '近 7 天未刷题' })
        ]),
        APP.el('div', { class: 'bar' }, [APP.el('i', { style: 'width:' + acc + '%;background:' + color })])
      ]));
      if (weakChaps.length) {
        card.appendChild(APP.el('div', { style: 'font-size:11.5px;color:var(--danger);padding-left:4px;margin-top:-4px;margin-bottom:6px', text: '薄弱章节：' + weakChaps.map(x => x.chapter + '(' + x.accuracy + '%)').join('、') }));
      }
    });
    return card;
  }

};

  }
  function ovStat(label, value) { return APP.el('div', { class: 'stat' }, [APP.el('div', { class: 'label', text: label }), APP.el('div', { class: 'value', style: 'font-size:20px', text: value })]); }

  // 单词可视化：柱状图（每日新词）+ 折线图（默写正确率）+ 环形图（累计正确率）
  function buildWordViz(period) {
    const [ty, tm, td] = today.split('-').map(Number);
    const _dow = (y, m, d) => (new Date(y, m - 1, d).getDay() + 6) % 7; // 周一 = 0
    const _range = (s, e) => { const o = []; let d = s; while (d <= e) { o.push(d); d = U.addDays(d, 1); } return o; };
    let dateList;
    if (period === 'week') { const mon = U.addDays(today, -_dow(ty, tm, td)); dateList = _range(mon, U.addDays(mon, 6)); } // 本周一 ~ 本周日
    else if (period === 'month') { const first = ty + '-' + String(tm).padStart(2, '0') + '-01'; const lastDay = new Date(ty, tm, 0).getDate(); const last = ty + '-' + String(tm).padStart(2, '0') + '-' + String(lastDay).padStart(2, '0'); dateList = _range(first, last); } // 本月 1 号 ~ 月末
    else { dateList = _range('2026-08-03', today); } // 全部：从实际学习起点 8/3 起
    const dates = []; const newWords = []; const accuracies = [];
    let totalRecs = 0, totalCorrect = 0, totalWords = 0;
    dateList.forEach(d => {
      dates.push(d.slice(5));
      newWords.push(Number(st.studyLog[d]?.wordNew) || 0);
      const rec = (eng.wordRecords || {})[d];
      if (rec && rec.total > 0) {
        const correct = rec.total - (rec.spellingErrors || []).length - (rec.meaningErrors || []).length;
        accuracies.push(Math.round(correct / rec.total * 100));
        totalRecs++;
        totalCorrect += correct;
        totalWords += rec.total;
      } else {
        accuracies.push(null);
      }
    });
    const overallAcc = totalWords > 0 ? Math.round(totalCorrect / totalWords * 100) : 0;

    const W = 640, H = 220, padL = 36, padR = 16, padT = 16, padB = 28;
    const chartW = W - padL - padR, chartH = H - padT - padB;
    const n = dates.length;
    const barW = Math.max(4, Math.min(28, Math.floor(chartW / n * 0.6)));
    const step = n > 1 ? chartW / (n - 1) : chartW;

    // 柱状图（每日新词）
    const maxNW = Math.max(1, ...newWords);
    let bars = '';
    newWords.forEach((v, i) => {
      const h = (v / maxNW) * chartH;
      const x = padL + (n > 1 ? i * step : chartW / 2) - barW / 2;
      const y = padT + chartH - h;
      bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="3" fill="var(--accent)" opacity="0.85"/>`;
      if (v > 0) bars += `<text x="${x + barW / 2}" y="${y - 4}" text-anchor="middle" font-size="10" fill="var(--text)">${v}</text>`;
    });

    // 折线图（默写正确率）
    let linePts = '';
    const validAcc = accuracies.map((a, i) => a != null ? { i, a } : null).filter(Boolean);
    if (validAcc.length > 1) {
      linePts = validAcc.map((p, idx) => {
        const x = padL + (n > 1 ? p.i * step : chartW / 2);
        const y = padT + chartH - (p.a / 100) * chartH;
        return (idx === 0 ? 'M' : 'L') + x + ',' + y;
      }).join(' ');
    }
    // 折线数据点
    let dots = '';
    validAcc.forEach(p => {
      const x = padL + (n > 1 ? p.i * step : chartW / 2);
      const y = padT + chartH - (p.a / 100) * chartH;
      dots += `<circle cx="${x}" cy="${y}" r="3.5" fill="#18202B"/><text x="${x}" y="${y - 8}" text-anchor="middle" font-size="10" fill="var(--text)">${p.a}%</text>`;
    });

    // X轴日期标签（稀疏显示避免重叠）
    let xLabels = '';
    const skip = n > 14 ? Math.ceil(n / 7) : 1;
    dates.forEach((d, i) => {
      if (i % skip === 0) {
        const x = padL + (n > 1 ? i * step : chartW / 2);
        xLabels += `<text x="${x}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${d}</text>`;
      }
    });

    // 环形图（累计正确率）
    const R = 42, r = 30, cx = 580, cy = 110;
    const circ = 2 * Math.PI * R;
    const dash = (overallAcc / 100) * circ;
    const ring = overallAcc > 0
      ? `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${dash} ${circ - dash}" transform="rotate(-90 ${cx} ${cy})"/><text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text)">${overallAcc}%</text><text x="${cx}" y="${cy + 20}" text-anchor="middle" font-size="10" fill="var(--muted)">累计正确率</text>`
      : `<text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="12" fill="var(--muted)">无数据</text>`;

    const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:6px">
      <line x1="${padL}" y1="${padT + chartH}" x2="${W - padR}" y2="${padT + chartH}" stroke="var(--border)" stroke-width="1"/>
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + chartH}" stroke="var(--border)" stroke-width="1"/>
      ${bars}
      ${linePts ? `<path d="${linePts}" fill="none" stroke="#18202B" stroke-width="2" stroke-linejoin="round"/>` : ''}
      ${dots}
      ${xLabels}
      ${ring}
    </svg>`;

    return APP.el('div', { style: 'overflow-x:auto' }, [
      APP.el('div', { style: 'font-size:12px;color:var(--muted);margin-bottom:4px', text: '柱状 = 每日新词　折线 = 默写正确率　环形 = 累计正确率' }),
      APP.el('div', { html: svg })
    ]);
  }

  // ---------- 单词 ----------
  function renderWords() {
    eng.words = eng.words || {};
    const list = eng.words[today] || [];

    // 1. 单词爬坡表
    const ramp = APP.el('div', { class: 'card' }, [
      APP.el('h3', { text: '单词爬坡表', html: '' }),
      APP.el('div', { class: 'sub', text: '基准日 2026-08-03 · 新:旧 = 1:3 · A4纸法为主，APP仅碎片复习旧词' }),
      rampRow('第1-2周', '30 新词/天', '约120'),
      rampRow('第3-4周', '35 新词/天', '约140'),
      rampRow('第5-6周', '40 新词/天', '约160'),

      rampRow('第9周起', '50 封顶/天', '约200')
    ]);
    container.appendChild(ramp);

    // 2. 今日数据
    const log = st.studyLog[today] || {};
    const wn = Number(log.wordNew) || 0;
    const wo = Number(log.wordOld) || 0;
    const target = (APP.wordTarget ? APP.wordTarget(today) : 50);
    const todayCard = APP.el('div', { class: 'card' }, [
      APP.el('h3', { text: '今日数据', html: '' }),
      APP.el('div', { class: 'spread', style: 'margin-bottom:6px' }, [
        APP.el('span', { class: 'muted', style: 'font-size:12.5px', text: '今日新词 ' + wn + ' / 目标 ' + target }),
        APP.el('span', { class: 'pill', style: 'background:var(--accent-soft);color:var(--accent)', text: '旧词复习 ' + wo })
      ]),
      APP.el('div', { class: 'bar' }, [APP.el('i', { style: 'width:' + Math.min(100, Math.round(wn / target * 100)) + '%' })])
    ]);
    container.appendChild(todayCard);

    // 3. 预计第一轮完成日
    let totalNew = 0, daysWithNew = 0;
    for (const d in st.studyLog) { const v = Number(st.studyLog[d].wordNew) || 0; if (v > 0) { totalNew += v; daysWithNew++; } }
    const avg = daysWithNew ? totalNew / daysWithNew : 0;
    const remain = Math.max(0, 1800 - totalNew);
    const remainDays = avg > 0 ? Math.ceil(remain / avg) : null;
    const estDate = remainDays != null ? U.addDays(today, remainDays) : '打卡后估算';
    const estCard = APP.el('div', { class: 'card' }, [
      APP.el('div', { class: 'grid grid-3' }, [
        estStat('已累计新词', totalNew + ' / 1800'),
        estStat('日均新词', avg ? avg.toFixed(1) : '—'),
        estStat('预计第一轮完成', estDate)
      ])
    ]);
    container.appendChild(estCard);

    // 4. 今日默写掌握情况
    const rec = (eng.wordRecords || {})[today];
    const recCard = APP.el('div', { class: 'card' }, [
      APP.el('div', { class: 'spread' }, [
        APP.el('h3', { text: '今日默写掌握情况', html: '' }),
        APP.el('button', { class: 'btn sm primary', text: rec ? '编辑' : '录入', onclick: editRec })
      ])
    ]);
    if (rec) {
      const correct = rec.total - (rec.spellingErrors || []).length - (rec.meaningErrors || []).length;
      const accuracy = rec.total > 0 ? Math.round(correct / rec.total * 100) : 0;
      recCard.appendChild(APP.el('div', { class: 'grid grid-3' }, [
        estStat('总词数', rec.total),
        estStat('拼写错误', (rec.spellingErrors || []).length),
        estStat('释义错误', (rec.meaningErrors || []).length)
      ]));
      recCard.appendChild(APP.el('div', { class: 'spread', style: 'margin:10px 0 6px' }, [
        APP.el('span', { class: 'muted', style: 'font-size:12.5px', text: '正确率 ' + accuracy + '%' }),
        APP.el('span', { class: 'pill', style: 'background:var(--accent-soft);color:var(--accent)', text: (rec.spellingErrors || []).length + (rec.meaningErrors || []).length + ' 词需复习' })
      ]));
      if (rec.spellingErrors && rec.spellingErrors.length) {
        recCard.appendChild(APP.el('div', { class: 'muted', style: 'font-size:12.5px;margin-top:6px' }, [
          APP.el('b', { text: '拼写错词：' }),
          APP.el('span', { text: rec.spellingErrors.join('、') })
        ]));
      }
      if (rec.meaningErrors && rec.meaningErrors.length) {
        recCard.appendChild(APP.el('div', { class: 'muted', style: 'font-size:12.5px;margin-top:4px' }, [
          APP.el('b', { text: '释义错词：' }),
          ...rec.meaningErrors.map(m => APP.el('div', { style: 'margin-left:8px' }, [
            APP.el('span', { style: 'font-weight:600', text: m.word }), ' — ', APP.el('span', { text: m.meaning })
          ]))
        ]));
      }
      if (rec.suggestions) {
        recCard.appendChild(APP.el('div', { style: 'margin-top:8px;padding:8px;background:var(--surface-2);border-radius:6px;font-size:12.5px;line-height:1.5', text: '💡 ' + rec.suggestions }));
      }
    } else {
      recCard.appendChild(APP.el('div', { class: 'empty', text: '今天还没录入默写掌握情况；可记录总词数、拼写错词、释义错词与复习建议' }));
    }
    container.appendChild(recCard);

    // 4.5 单词默写复盘总览（聚合所有日期的默写记录）
    const allRecs = Object.values((eng.wordRecords) || {}).filter(r => r && (Number(r.total) || 0) > 0);
    const passOf = (r) => r.pass || ((Number(r.reviewCount) || 0) === 0 ? '一刷' : '二刷');
    const passOrder = ['一刷', '二刷', '三刷', '四刷', '五刷', '六刷'];
    const sumWords = allRecs.reduce((s, r) => s + (Number(r.total) || 0), 0);
    const recAcc = (r) => { const tot = Number(r.total) || 0; const err = (r.spellingErrors || []).length + (r.meaningErrors || []).length; return tot > 0 ? Math.round((tot - err) / tot * 100) : null; };
    const groupAcc = (arr) => { const tot = arr.reduce((s, r) => s + (Number(r.total) || 0), 0); const err = arr.reduce((s, r) => s + (r.spellingErrors || []).length + (r.meaningErrors || []).length, 0); return tot > 0 ? Math.round((tot - err) / tot * 100) : null; };
    const passes = passOrder.filter(p => allRecs.some(r => passOf(r) === p));
    const reviewCard = APP.el('div', { class: 'card', style: 'margin-top:14px' }, [
      APP.el('div', { class: 'spread' }, [
        APP.el('h3', { text: '单词默写复盘', html: '' }),
        APP.el('span', { class: 'muted', style: 'font-size:12px', text: allRecs.length + ' 次默写记录' })
      ])
    ]);
    if (sumWords > 0) {
      const statCells = passes.map(p => estStat(p + '正确率', (() => { const a = groupAcc(allRecs.filter(r => passOf(r) === p)); return a != null ? a + '%' : '—'; })()));
      reviewCard.appendChild(APP.el('div', { class: 'grid grid-3', style: 'margin-top:6px' }, [
        estStat('累计刷词量', sumWords + ' 词'),
        ...statCells
      ]));
      reviewCard.appendChild(APP.el('div', { class: 'spread', style: 'margin-top:10px;font-size:12.5px;color:var(--text-2)' }, [
        APP.el('span', { text: passes.map(p => p + ' ' + allRecs.filter(r => passOf(r) === p).length + ' 次').join(' · ') }),
        APP.el('span', { class: 'pill', style: 'background:var(--surface-2);color:var(--text-2)', text: '总体正确率 ' + groupAcc(allRecs) + '%' })
      ]));
    }
    // 错误词汇总（首次写 + 每次复盘的错误汇总，标注所在轮次）
    if (sumWords > 0) {
      const spellMap = {}; // word -> Set(passes)
      const meanMap = {};  // word -> { m:Set(meanings), p:Set(passes) }
      allRecs.forEach(r => {
        const p = passOf(r);
        (r.spellingErrors || []).forEach(w => { (spellMap[w] = spellMap[w] || new Set()).add(p); });
        (r.meaningErrors || []).forEach(m => { const e = meanMap[m.word] = meanMap[m.word] || { m: new Set(), p: new Set() }; e.m.add(m.meaning); e.p.add(p); });
      });
      const spellWords = Object.keys(spellMap), meanWords = Object.keys(meanMap);
      const errBox = APP.el('div', { style: 'margin-top:12px;padding:12px;background:var(--surface-2);border-radius:10px' }, [
        APP.el('div', { style: 'font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text-2)', text: '错误词汇总（拼写 ' + spellWords.length + ' 词 · 释义 ' + meanWords.length + ' 词）' })
      ]);
      if (!spellWords.length && !meanWords.length) errBox.appendChild(APP.el('div', { class: 'muted', style: 'font-size:12.5px', text: '暂无错误词，继续保持！' }));
      if (spellWords.length) errBox.appendChild(APP.el('div', { style: 'font-size:12.5px;margin-bottom:8px;line-height:1.6' }, [
        APP.el('b', { text: '拼写错词：' }),
        APP.el('span', { class: 'muted', text: spellWords.map(w => w + '（' + [...spellMap[w]].join('/') + '）').join('、') })
      ]));
      if (meanWords.length) errBox.appendChild(APP.el('div', { style: 'font-size:12.5px;line-height:1.6' }, [
        APP.el('b', { text: '释义错词：' }),
        ...meanWords.map(w => APP.el('div', { style: 'margin-left:8px;margin-top:2px', text: w + '：' + [...meanMap[w].m].join('/') + '（' + [...meanMap[w].p].join('/') + '）' }))
      ]));
      reviewCard.appendChild(errBox);
    }
    if (allRecs.length) {
      const maxW = Math.max.apply(null, allRecs.map(r => Number(r.total) || 0));
      const rows = allRecs.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(r => {
        const tot = Number(r.total) || 0;
        const err = (r.spellingErrors || []).length + (r.meaningErrors || []).length;
        const acc = recAcc(r);
        const w = maxW > 0 ? Math.round(tot / maxW * 100) : 0;
        const color = acc >= 85 ? 'var(--accent)' : acc >= 65 ? '#B1B2AE' : 'var(--danger)';
        return APP.el('div', { style: 'margin-top:8px' }, [
          APP.el('div', { class: 'spread', style: 'font-size:12px' }, [
            APP.el('span', { text: passOf(r) + ' · ' + (r.listName || r.date || '默写') + ' · ' + (r.date || '') }),
            APP.el('span', { class: 'muted', text: acc + '% · ' + tot + ' 词' })
          ]),
          APP.el('div', { class: 'bar' }, [APP.el('i', { style: 'width:' + w + '%;background:' + color })])
        ]);
      });
      reviewCard.appendChild(APP.el('div', { style: 'margin-top:12px;padding-top:10px;border-top:1px solid var(--border)' }, [
        APP.el('div', { class: 'muted', style: 'font-size:12px;margin-bottom:4px', text: '各次默写正确率（按日期）' }),
        ...rows
      ]));
    } else {
      reviewCard.appendChild(APP.el('div', { class: 'empty', style: 'margin-top:8px', text: '还没有默写记录，去「今日默写掌握情况」录入后会在这里汇总复盘' }));
    }
    container.appendChild(reviewCard);

    // 5. 词汇列表
    const card = APP.el('div', { class: 'card' });
    card.appendChild(APP.el('div', { class: 'spread' }, [
      APP.el('h3', { text: '今日单词 (' + list.length + ')', html: '' }),
      APP.el('button', { class: 'btn sm primary', text: '+ 添加', onclick: addWord })
    ]));
    if (!list.length) card.appendChild(APP.el('div', { class: 'empty', text: '今天还没加单词，点击添加；新词数量请在「学习日志→打卡」里记录' }));
    list.forEach(w => card.appendChild(APP.el('div', { class: 'list-row' }, [
      APP.el('div', { style: 'flex:1' }, [APP.el('b', { text: w.word }), '  ', APP.el('span', { class: 'muted', text: w.meaning })]),
      APP.el('button', { class: 'btn sm' + (w.reviewed ? '' : ' primary'), text: w.reviewed ? '已复习 ✓' : '遗忘复习', onclick: () => { w.reviewed = !w.reviewed; APP.store.save(); APP.refresh(); } }),
      APP.el('button', { class: 'btn sm ghost', text: '✕', onclick: () => { eng.words[today] = list.filter(x => x !== w); APP.store.save(); APP.refresh(); } })
    ])));
    container.appendChild(card);
    function addWord() {
      const fW = APP.el('input', { placeholder: '单词' });
      const fM = APP.el('input', { placeholder: '释义' });
      setTimeout(() => fW.focus(), 30);
      APP.openModal('添加单词 · ' + today, APP.el('div', {}, [APP.field('单词', fW), APP.field('释义', fM)]), [
        APP.el('button', { class: 'btn', text: '取消', onclick: APP.closeModal }),
        APP.el('button', { class: 'btn primary', text: '添加', onclick: () => {
          const w = fW.value.trim(); if (!w) return APP.toast('请输入单词');
          eng.words[today] = eng.words[today] || [];
          eng.words[today].push({ word: w, meaning: fM.value.trim(), reviewed: false });
          APP.store.save(); APP.closeModal(); APP.refresh();
        } })
      ]);
    }
    function editRec() {
      const rec = (eng.wordRecords || {})[today] || { total: 0, spellingErrors: [], meaningErrors: [], suggestions: '' };
      const defPass = rec.pass || ((Number(rec.reviewCount) || 0) === 0 ? '一刷' : '二刷');
      const fTotal = APP.el('input', { type: 'number', value: rec.total || 0, placeholder: '总词数' });
      const fPass = APP.el('select', {}, ['一刷', '二刷', '三刷', '四刷', '五刷', '六刷'].map(p => APP.el('option', { value: p, selected: p === defPass ? 'selected' : false, text: p })));
      const fSpell = APP.el('textarea', { value: (rec.spellingErrors || []).join('、'), placeholder: '拼写错误词，用顿号/逗号/换行分隔', style: 'min-height:50px' });
      const fMean = APP.el('textarea', { value: (rec.meaningErrors || []).map(m => m.word + '：' + m.meaning).join('\n'), placeholder: '释义错误，每行格式：单词：正确释义', style: 'min-height:80px' });
      const fSug = APP.el('textarea', { value: rec.suggestions || '', placeholder: '复习建议', style: 'min-height:60px' });
      APP.openModal('录入默写掌握情况 · ' + today, APP.el('div', {}, [
        APP.field('总词数', fTotal),
        APP.field('轮次（首次写=一刷，复盘=二刷…）', fPass),
        APP.field('拼写错误词（顿号/逗号/换行分隔）', fSpell),
        APP.field('释义错误（每行：单词：释义）', fMean),
        APP.field('复习建议', fSug)
      ]), [
        APP.el('button', { class: 'btn', text: '取消', onclick: APP.closeModal }),
        APP.el('button', { class: 'btn danger', text: '删除', onclick: () => { delete eng.wordRecords[today]; APP.store.save(); APP.closeModal(); APP.refresh(); } }),
        APP.el('button', { class: 'btn primary', text: '保存', onclick: () => {
          const total = Number(fTotal.value) || 0;
          const spelling = fSpell.value.split(/[,，、\n]/).map(s => s.trim()).filter(Boolean);
          const meaning = [];
          fMean.value.split('\n').forEach(line => {
            const m = line.match(/^(.+?)[：:](.+)$/);
            if (m) meaning.push({ word: m[1].trim(), meaning: m[2].trim() });
