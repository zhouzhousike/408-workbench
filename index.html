  const pToday = filt(practices).filter(r => r.date === today);
  const todayTotal = pToday.reduce((s, r) => s + (Number(r.total) || 0), 0);
  const todayCorrect = pToday.reduce((s, r) => s + (Number(r.correct) || 0), 0);
  const todayWrong = todayTotal - todayCorrect;
  const weakChaps = (APP.chapterAccuracy(filt(practices)) || []).filter(x => x.accuracy < 60 && x.total >= 5).length;
  const cumDone = filt(practices).reduce((s, r) => s + (Number(r.total) || 0), 0);
  const wrongCount = pf === '全部' ? list.length : list.filter(q => q.subject === pf).length;
  const filterTabs = APP.el('div', { class: 'row', style: 'margin-bottom:12px' });
  ['全部'].concat(APP.BOARDS).forEach(b => {
    filterTabs.appendChild(APP.el('button', { class: 'chip', style: b === pf ? 'border-color:var(--accent);color:var(--accent);font-weight:600' : '', text: b, onclick: () => { APP._wqPracticeFilter = b; APP.refresh(); } }));
  });
  container.appendChild(filterTabs);
  const stats = APP.el('div', { class: 'grid grid-5' }, [
    stat('今日做题', todayTotal + ' 题'),
    stat('今日错题', todayWrong + ' 题'),
    stat('累计错题', wrongCount + ' 道'),
    stat('薄弱章节', weakChaps + ' 个'),
    stat('累计刷题', cumDone + ' 题')
  ]);
  container.appendChild(stats);

  container.appendChild(APP.el('div', { class: 'row', style: 'margin:14px 0' }, [
    APP.el('button', { class: 'btn primary', text: '+ 录入今日刷题', onclick: () => editPractice(null) })
  ]));

  // tabs
  const tabs = APP.el('div', { class: 'row', style: 'margin-bottom:12px' });
  [['practices', '刷题记录'], ['wrong', '错题库']].forEach(([k, l]) => {
    tabs.appendChild(APP.el('button', { class: 'chip', style: k === tab ? 'border-color:var(--accent);color:var(--accent);font-weight:600' : '', text: l, onclick: () => { APP._wqTab = k; APP.refresh(); } }));
  });
  container.appendChild(tabs);

  if (tab === 'practices') renderPractices();
  else renderWrongBank();

  function stat(label, value) { return APP.el('div', { class: 'stat' }, [APP.el('div', { class: 'label', text: label }), APP.el('div', { class: 'value', text: value })]); }

  function renderPractices() {
    const card = APP.el('div', { class: 'card' });
    if (!filt(practices).length) {
      card.appendChild(APP.el('div', { class: 'empty', text: '还没有刷题记录，点上方「录入今日刷题」把今天的练习录进来' }));
      container.appendChild(card);
      return;
    }
    card.appendChild(APP.el('div', { class: 'sub', style: 'margin-bottom:10px', text: '按记录自动计算正确率；展开可查看每道错题题干；点击「AI 分析」获得针对性建议。' }));
    filt(practices).slice().reverse().forEach(r => {
      const wrongCount = (Number(r.total) || 0) - (Number(r.correct) || 0);
      const acc = (Number(r.total) || 0) > 0 ? Math.round((Number(r.correct) || 0) / Number(r.total) * 100) : 0;
      const isWeak = acc < 60 && (Number(r.total) || 0) >= 5;
      const row = APP.el('div', { class: 'list-row', style: 'display:block' });
      const top = APP.el('div', { class: 'spread', style: 'align-items:flex-start' });
      top.appendChild(APP.el('div', { style: 'flex:1' }, [
        APP.subjectTag(r.subject),
        ' ',
        APP.el('b', { text: r.source || '未命名来源' }),
        APP.el('div', { class: 'muted', style: 'font-size:12px;margin-top:2px', text: (r.date || '') + ' · ' + (r.chapter || '未分类') + ' · ' + r.pass + ' · ' + (r.correct || 0) + '/' + (r.total || 0) })
      ]));
      top.appendChild(APP.el('div', { class: 'row', style: 'gap:8px' }, [
        isWeak ? APP.el('span', { class: 'pill', style: 'background:#fff0f0;color:var(--danger)', text: '薄弱' }) : null,
        APP.el('span', { class: 'pill', style: 'background:var(--accent-soft);color:var(--accent)', text: acc + '%' }),
        APP.el('button', { class: 'btn sm', text: 'AI 分析', onclick: () => aiAnalyze(r) }),
        APP.el('button', { class: 'btn sm ghost', text: '编辑', onclick: () => editPractice(r) }),
        APP.el('button', { class: 'btn sm ghost', text: '展开', onclick: (e) => { const detail = e.target.parentNode.parentNode.parentNode.querySelector('.wq-detail'); detail.style.display = detail.style.display === 'none' ? 'block' : 'none'; e.target.textContent = detail.style.display === 'none' ? '展开' : '收起'; } })
      ]));
      row.appendChild(top);
      const barWrap = APP.el('div', { style: 'margin-top:8px' }, [
        APP.el('div', { class: 'bar' }, [APP.el('i', { style: 'width:' + acc + '%;background:' + (acc >= 80 ? '#18202B' : acc >= 60 ? '#93A4C1' : 'var(--danger)') })])
      ]);
      row.appendChild(barWrap);
      const detail = APP.el('div', { class: 'wq-detail', style: 'display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)' });
      if ((r.wrongItems || []).length) {
        detail.appendChild(APP.el('div', { style: 'font-size:12px;font-weight:600;margin-bottom:6px', text: '错题题干（可点编辑补充错因）' }));
        r.wrongItems.forEach((it, idx) => {
          detail.appendChild(APP.el('div', { class: 'card', style: 'padding:8px;margin-bottom:6px' }, [
            APP.el('div', { class: 'spread', style: 'margin-bottom:4px' }, [
              APP.el('span', { style: 'font-size:12px;font-weight:600', text: '第 ' + (it.number || (idx + 1)) + ' 题' }),
              APP.el('span', { class: 'pill sm', style: 'background:var(--surface-2);color:var(--text-2)', text: it.reason || '待分析' })
            ]),
            APP.el('div', { style: 'font-size:12.5px', text: it.text || '（未录入题干）' })
          ]));
        });
      } else if (wrongCount > 0) {
        detail.appendChild(APP.el('div', { class: 'muted', style: 'font-size:12px', text: '已记录 ' + wrongCount + ' 道错题，未补充题干。点编辑可补录。' }));
      }
      if (r.note) detail.appendChild(APP.el('div', { class: 'muted', style: 'font-size:12px;margin-top:6px', text: '备注：' + r.note }));
      row.appendChild(detail);
      card.appendChild(row);
    });
    container.appendChild(card);
  }

  function renderWrongBank() {
    const filter = APP._wqFilter || '全部';
    APP._wqFilter = filter;
    const filterTabs = APP.el('div', { class: 'row', style: 'margin-bottom:10px' });
    ['全部'].concat(APP.BOARDS).forEach(b => {
      filterTabs.appendChild(APP.el('button', { class: 'chip', style: b === filter ? 'border-color:var(--accent);color:var(--accent);font-weight:600' : '', text: b, onclick: () => { APP._wqFilter = b; APP.refresh(); } }));
    });
    container.appendChild(filterTabs);

    const shown = filter === '全部' ? list : list.filter(q => q.subject === filter);
    const card = APP.el('div', { class: 'card' });
    if (!shown.length) card.appendChild(APP.el('div', { class: 'empty', text: '该板块还没有错题，在「刷题记录」里录入会自动生成错题。' }));
    else shown.slice().reverse().forEach(q => {
      const overdue = q.nextReview && q.nextReview <= today && q.mastery < 5;
      card.appendChild(APP.el('div', { class: 'list-row', style: 'display:block' }, [
        APP.el('div', { class: 'spread' }, [
          APP.el('div', { style: 'flex:1' }, [
            APP.el('b', { text: q.title || '(未命名)' }),
            ' ',
            APP.subjectTag(q.subject),
            ' ',
            APP.el('span', { class: 'muted', style: 'font-size:12px', text: (q.source ? q.source + ' · ' : '') + (q.knowledgePoint || '') })
          ]),
          APP.el('div', { class: 'row' }, [
            q.secondPass ? APP.el('span', { class: 'pill', style: 'background:var(--accent-soft);color:var(--accent)', text: '已二刷' }) : null,
            overdue ? APP.el('span', { class: 'pill', style: 'background:#fff0f0;color:var(--danger);border-color:#ffc9c9', text: '待复习' }) : null,
            APP.el('span', { class: 'muted', style: 'font-size:12px', text: '掌握 ' + q.mastery + '/5 · 复习' + (q.reviewCount || 0) + '次' }),
            APP.el('button', { class: 'btn sm primary', text: '复习', onclick: () => doReview(q) }),
            APP.el('button', { class: 'btn sm', text: '编辑', onclick: () => editQ(q) })
          ])
        ]),
        APP.el('div', { class: 'muted', style: 'font-size:12.5px;margin-top:4px' }, [
          APP.el('div', {}, (q.reasons || []).map(r => APP.el('span', { class: 'pill', style: 'margin-right:5px;background:var(--surface-2);color:var(--text-2)', text: r }))),
          q.solution ? APP.el('div', { text: '解决：' + q.solution }) : null,
          q.nextReview ? APP.el('div', { class: 'muted', text: '下次复习：' + q.nextReview }) : null
        ])
      ]));
    });
    container.appendChild(card);
  }

  function doReview(q) {
    q.reviewCount = (q.reviewCount || 0) + 1;
    q.lastReview = today;
    const gap = APP.nextReviewGap(q.reviewCount);
    q.nextReview = U.addDays(today, gap);
    if (q.reviewCount >= 3 && q.mastery < 5) q.mastery = Math.min(5, q.mastery + 1);
    APP.store.save(); APP.toast('已复习，下次：' + q.nextReview); APP.refresh();
  }

  function aiAnalyze(r) {
    const wrongItems = r.wrongItems || [];
    const wrongCount = (Number(r.total) || 0) - (Number(r.correct) || 0);
    const acc = (Number(r.total) || 0) > 0 ? Math.round((Number(r.correct) || 0) / Number(r.total) * 100) : 0;
    // 本地规则分析
    const advices = [];
    if (acc < 50) advices.push('本章正确率低于 50%，建议暂停刷新题，先回头补基础概念与例题。');
    else if (acc < 70) advices.push('正确率在 60% 左右波动，说明有概念/思路缺口，需把错题归类后集中二刷。');
    if (wrongItems.some(it => it.reason === '概念错误')) advices.push('错题中存在「概念错误」，建议把对应公式/定义手写一遍，并找 2-3 道同考点题验证。');
    if (wrongItems.some(it => it.reason === '计算错误')) advices.push('「计算错误」较多时，每天额外做 5-10 道纯计算小题，限时训练减少失误。');
    if (wrongItems.some(it => it.reason === '思路错误')) advices.push('「思路错误」说明题型识别弱，建议整理该章节典型题的第一步破题信号。');
    if (wrongItems.some(it => it.reason === '粗心')) advices.push('「粗心」类错题要订正审题流程：圈关键词、写公式再代值、最后验算。');
    if (advices.length === 0) advices.push('正确率良好，继续保持；错题建议按 3-7-14-30 天间隔复习。');

    // 生成可复制给 AI 的 prompt
    const prompt = `我是2028考研11408考生，正在复习【${r.subject}】。
今日练习来源：${r.source || '—'}，章节/知识点：${r.chapter || '—'}，${r.pass}。
做题情况：共 ${r.total || 0} 题，对 ${r.correct || 0} 题，正确率 ${acc}%。
错题题号与题干：
${wrongItems.map((it, i) => `${i + 1}. 第 ${it.number || (i + 1)} 题：${it.text || '（题干未录入）'}（错因：${it.reason || '待分析'}）`).join('\n')}

请从以下角度给我复盘建议：
1. 薄弱知识点定位（具体到哪里不会）；
2. 接下来 3 天针对该章节的补弱动作；
3. 同类题训练清单（列出 3-5 道可练的题号/考点，来源不限）；
4. 防止再错的具体习惯建议。`;

    const out = APP.el('div', { style: 'max-height:260px;overflow:auto' }, [
      APP.el('h4', { style: 'font-size:13px;margin:8px 0 6px', text: '本地快速建议' }),
      APP.el('ul', {}, advices.map(a => APP.el('li', { style: 'font-size:12.5px;margin-bottom:4px', text: a }))),
      APP.el('h4', { style: 'font-size:13px;margin:14px 0 6px', text: '可复制给 AI 的提示词' }),
      APP.el('pre', { class: 'box', style: 'font-size:12px;white-space:pre-wrap', text: prompt })
    ]);
    APP.openModal('AI 错题分析 · ' + (r.chapter || '本章'), out, [
      APP.el('button', { class: 'btn', text: '关闭', onclick: APP.closeModal }),
      APP.el('button', { class: 'btn primary', text: '复制提示词', onclick: () => {
        if (navigator.clipboard) navigator.clipboard.writeText(prompt).then(() => APP.toast('提示词已复制'), () => APP.toast('复制失败'));
        else APP.toast('当前环境不支持复制');
      } })
    ]);
  }

  function editPractice(r) {
    const isNew = !r;
    const o = r || { id: APP.uid(), date: today, subject: APP.BOARDS[1], source: '', chapter: '', total: 0, correct: 0, wrongItems: [], note: '', pass: '一刷' };
    o.wrongItems = (o.wrongItems || []).slice();
    const fDate = APP.el('input', { type: 'date', value: o.date || today });
    const fSub = APP.el('select', {}, APP.BOARDS.map(s => APP.el('option', { value: s, selected: s === o.subject ? 'selected' : false, text: s })));
    const fSource = APP.el('input', { value: o.source || '', placeholder: '如：李林880 / 张宇1000 / 408真题' });
    const fCh = APP.el('input', { value: o.chapter || '', placeholder: '如：第1讲 函数极限与连续 / 数据结构·线性表' });
    const fTotal = APP.el('input', { type: 'number', min: '0', value: o.total || 0 });
    const fCorrect = APP.el('input', { type: 'number', min: '0', value: o.correct || 0 });
    const fPass = APP.el('select', {}, ['一刷', '二刷'].map(p => APP.el('option', { value: p, selected: p === o.pass ? 'selected' : false, text: p })));
    const fNote = APP.el('textarea', { value: o.note || '', placeholder: '备注（可选）', style: 'min-height:50px' });

    // editable wrong-item list
    const wrongBox = APP.el('div', {});
    function renderWrongList() {
      APP.clear(wrongBox);
      if (!o.wrongItems.length) {
        wrongBox.appendChild(APP.el('div', { class: 'muted', style: 'font-size:12px', text: '点击下方「+ 添加错题」逐道录入错题题号与题干。' }));
        return;
      }
      o.wrongItems.forEach((it, idx) => {
        const numInp = APP.el('input', { value: it.number || '', placeholder: '题号', style: 'width:70px' });
        numInp.addEventListener('change', e => { o.wrongItems[idx].number = e.target.value.trim(); });
        const reasonSel = APP.el('select', {}, ['', '概念错误', '思路错误', '计算错误', '粗心'].map(r => APP.el('option', { value: r, selected: r === (it.reason || ''), text: r || '错因' })));
        reasonSel.addEventListener('change', e => { o.wrongItems[idx].reason = e.target.value; });
        const textTa = APP.el('textarea', { value: it.text || '', placeholder: '题干或关键描述', style: 'min-height:44px' });
        textTa.addEventListener('change', e => { o.wrongItems[idx].text = e.target.value.trim(); });
        wrongBox.appendChild(APP.el('div', { class: 'card', style: 'padding:8px;margin-bottom:6px' }, [
          APP.el('div', { class: 'spread', style: 'margin-bottom:4px' }, [
            APP.el('div', { class: 'row', style: 'gap:8px' }, [
              APP.el('div', {}, [APP.el('div', { class: 'muted', style: 'font-size:11px;margin-bottom:2px', text: '题号' }), numInp]),
              APP.el('div', {}, [APP.el('div', { class: 'muted', style: 'font-size:11px;margin-bottom:2px', text: '错因' }), reasonSel])
            ]),
            APP.el('button', { class: 'btn sm ghost', text: '删除', onclick: () => { o.wrongItems.splice(idx, 1); renderWrongList(); } })
          ]),
          textTa
        ]));
      });
    }
    renderWrongList();

    const addBtn = APP.el('button', { class: 'btn sm', text: '+ 添加错题', onclick: () => { o.wrongItems.push({ number: '', text: '', reason: '' }); renderWrongList(); } });

    const body = APP.el('div', {}, [
      APP.el('div', { class: 'grid grid-2' }, [APP.field('日期', fDate), APP.field('科目', fSub)]),
      APP.field('来源', fSource),
      APP.field('章节 / 知识点', fCh),
      APP.el('div', { class: 'grid grid-2' }, [APP.field('总题数', fTotal), APP.field('正确数', fCorrect)]),
      APP.el('div', { class: 'spread', style: 'margin:8px 0 4px' }, [
        APP.el('div', { style: 'font-size:13px;font-weight:600', text: '错题列表（' + o.wrongItems.length + ' 道）' }),
        addBtn
      ]),
      wrongBox,
      APP.el('div', { class: 'grid grid-2', style: 'margin-top:8px' }, [APP.field('第几遍', fPass), APP.field('备注', fNote)])
    ]);
    APP.openModal(isNew ? '录入今日刷题' : '编辑刷题记录', body, [
      APP.el('button', { class: 'btn', text: '取消', onclick: APP.closeModal }),
      isNew ? null : APP.el('button', { class: 'btn danger', text: '删除', onclick: () => { if (confirm('确认删除这条记录？')) { st.dailyPractice = practices.filter(x => x.id !== o.id); APP.store.save(); APP.closeModal(); APP.refresh(); } } }),
      APP.el('button', { class: 'btn primary', text: '保存', onclick: () => {
        const total = Math.max(0, Number(fTotal.value) || 0);
        const correct = Math.max(0, Math.min(total, Number(fCorrect.value) || 0));
        // sync wrongItems from DOM (for number/text that might not have triggered change)
        const cards = wrongBox.querySelectorAll('.card');
        const items = [];
        cards.forEach(card => {
          const num = card.querySelector('input')?.value?.trim() || '';
          const reason = card.querySelector('select')?.value || '';
          const text = card.querySelector('textarea')?.value?.trim() || '';
          if (num || text) items.push({ number: num, text, reason });
        });
        o.date = fDate.value || today;
        o.subject = fSub.value;
        o.source = fSource.value.trim();
        o.chapter = fCh.value.trim();
        o.total = total;
        o.correct = correct;
        o.wrongItems = items;
        o.pass = fPass.value;
        o.note = fNote.value.trim();
        if (isNew) st.dailyPractice.push(o);
        syncWrongQuestions(o);
        APP.store.save(); APP.closeModal(); APP.refresh();
      } })
    ]);
  }

  function syncWrongQuestions(r) {
    // 为每个错题项在 wrongQuestions 中生成一条记录（若同 source+chapter+number 已存在则跳过）
    (r.wrongItems || []).forEach(it => {
      const title = (r.source || '练习') + ' · ' + (r.chapter || '未分类') + ' 第' + it.number + '题';
      const exists = st.wrongQuestions.some(q => q.title === title && q.source === r.source && q.subject === r.subject);
      if (exists) return;
      st.wrongQuestions.push({
        id: APP.uid(),
        title: title,
        source: r.source || '',
        subject: r.subject,
        knowledgePoint: r.chapter || '',
        reasons: [],
        solution: '',
        mastery: 0,
        reviewCount: 0,
        nextReview: U.addDays(today, APP.REVIEW_GAPS[0]),
        lastReview: '',
        secondPass: false,
        history: [],
        text: it.text || ''
      });
    });
  }

  function editQ(q) {
    const isNew = !q;
    const o = q || { id: APP.uid(), title: '', source: '', subject: APP.BOARDS[0], knowledgePoint: '', reasons: [], solution: '', mastery: 0, reviewCount: 0, nextReview: U.addDays(today, APP.REVIEW_GAPS[0]), lastReview: '', secondPass: false, history: [], text: '' };
    const fTitle = APP.el('input', { value: o.title, placeholder: '题目简述' });
    const fSource = APP.el('input', { value: o.source, placeholder: '来源，如 880习题 / 张宇30讲' });
    const fSub = APP.el('select', {}, APP.BOARDS.map(s => APP.el('option', { value: s, selected: s === o.subject ? 'selected' : false, text: s })));
    const fKp = APP.el('input', { value: o.knowledgePoint, placeholder: '关联知识点/章节' });
    const fSol = APP.el('textarea', { value: o.solution, placeholder: '解决方案 / 正确思路', style: 'min-height:70px' });
    const fMas = APP.el('select', {}, [0, 1, 2, 3, 4, 5].map(i => APP.el('option', { value: i, selected: i === o.mastery ? 'selected' : false, text: i + ' ' + APP.masteryLabel(i) })));
    const fSecond = APP.el('input', { type: 'checkbox' });
    if (o.secondPass) fSecond.checked = true;
    const reasonBox = APP.el('div', { class: 'row' });
    REASONS.forEach(rn => {
      const cb = APP.el('input', { type: 'checkbox' });
      if ((o.reasons || []).includes(rn)) cb.checked = true;
      cb.dataset.reason = rn;
      reasonBox.appendChild(APP.el('label', { class: 'chip', style: 'cursor:pointer' }, [cb, ' ' + rn]));
    });
    const body = APP.el('div', {}, [
      APP.field('题目', fTitle),
      APP.field('具体来源', fSource),
      APP.field('板块', fSub),
      APP.field('知识点/章节', fKp),
      APP.field('错误原因（可多选）', reasonBox),
      APP.field('解决方案', fSol),
      APP.field('掌握状态', fMas),
      APP.el('label', { class: 'field' }, [APP.el('span', { text: '二刷' }), fSecond])
    ]);

        APP.el('b', { text: (type === 'weekly' ? '周(' + r.span + ')' : '月(' + r.span + ')') + ' · ' + r.created }),
        APP.el('button', { class: 'btn sm ghost', text: '✕', onclick: () => { st.reviews[type] = st.reviews[type].filter(x => x.id !== r.id); APP.store.save(); APP.refresh(); } })
      ]),
      APP.el('pre', { class: 'box', text: r.content })
    ]);
  }

  function aggregate(start, end) {
    let d = start;
    const res = { totalMin: 0, checkedDays: 0, math: 0, cs: 0, eng: 0, pol: 0, wordNew: 0, wordOld: 0, mathDone: 0, mathWrong: 0, csDone: 0, csWrong: 0, gains: [], probs: [] };
    while (d <= end) {
      const l = st.studyLog[d];
      if (l) {
        const m = l.subjectMin || {};
        res.math += Number(m.math) || 0; res.cs += Number(m.cs) || 0; res.eng += Number(m.eng) || 0; res.pol += Number(m.pol) || 0;
        res.totalMin += Number(l.minutes) || 0;
        if (Number(l.minutes) > 0) res.checkedDays++;
        res.wordNew += Number(l.wordNew) || 0; res.wordOld += Number(l.wordOld) || 0;
        res.mathDone += Number(l.mathDone) || 0; res.mathWrong += Number(l.mathWrong) || 0;
        res.csDone += Number(l.csDone) || 0; res.csWrong += Number(l.csWrong) || 0;
        if (l.gains && l.gains.trim()) res.gains.push(d + '：' + l.gains.trim());
        if (l.problems && l.problems.trim()) res.probs.push(d + '：' + l.problems.trim());
      }
      d = U.addDays(d, 1);
    }
    return res;
  }

  function genWeekly(date) {
    const ws = U.weekStart(date);
    const ae = aggregate(ws, date);
    const X = U.daysBetween(ws, date) + 1;
    const Y = ae.checkedDays;
    const rate = X ? Math.round(Y / X * 100) : 0;
    const wt = majorityWeekType(ws, date);
    const target = wt === '大周' ? 41 : 33;
    const subjTotal = ae.math + ae.cs + ae.eng;
    const shareOf = (m) => subjTotal > 0 ? m / subjTotal : 0;
    const targets = { math: 2 / 4.5, cs: 1.5 / 4.5, eng: 1 / 4.5 };
    const labelMap = { math: '数学一', cs: '专业课', eng: '英语一', pol: '政治' };
    const imbalance = [];
    ['math', 'cs', 'eng'].forEach(k => {
      const t = targets[k], a = shareOf(ae[k]);
      if (t > 0) { if (Math.abs(a - t) / t > 0.3) imbalance.push(labelMap[k] + '(' + (a * 100).toFixed(0) + '% vs 目标' + (t * 100).toFixed(0) + '%)'); }
      else if (ae[k] > 0) imbalance.push(labelMap[k] + '(应投入0)');
    });
    if (ae.pol > 0) imbalance.push('政治(基础阶段目标0)');
    const mathAcc = ae.mathDone > 0 ? Math.round((ae.mathDone - ae.mathWrong) / ae.mathDone * 100) : '—';
    const csAcc = ae.csDone > 0 ? Math.round((ae.csDone - ae.csWrong) / ae.csDone * 100) : '—';
    const content = `统计区间：${ws} ~ ${date}
出勤：${X}天 / 已打卡${Y}天（出勤率${rate}%）
本周总时长：${(ae.totalMin / 60).toFixed(1)}h / 目标 ${target}h（${wt}）
各科时长：数学${ae.math}min · 专业课 ${ae.cs}min · 英语${ae.eng}min · 政治${ae.pol}min
${imbalance.length ? '⚠ 失衡科目：' + imbalance.join('、') : '科目配比健康 ✓'}
单词：新词${ae.wordNew}个 · 旧词复习${ae.wordOld}个
做题：数学${ae.mathDone}题错${ae.mathWrong}（正确率${mathAcc}%）· 408 ${ae.csDone}题错${ae.csWrong}（正确率${csAcc}%）
错题重做：本周完成 ☐
本周问题汇总：
${ae.probs.join('\n') || '（无）'}
下周最重要的一件事：____（手动补）`;
    st.reviews.weekly.push({ id: APP.uid(), span: ws + '~' + date, created: U.todayStr(), content });
    APP.store.save(); APP.toast('已生成本周总结'); APP.refresh();
  }

  function genMonthly(date) {
    const mk = U.monthKey(date);
    const start = mk + '-01';
    const ae = aggregate(start, date);
    const content = `统计月份：${mk}
学习天数：${ae.checkedDays} 天
累计时长：${ae.totalMin} min（约 ${(ae.totalMin / 60).toFixed(1)} 小时）
单词：新词${ae.wordNew}个 · 旧词复习${ae.wordOld}个
做题：数学${ae.mathDone}题错${ae.mathWrong} · 408 ${ae.csDone}题错${ae.csWrong}
本月收获：
${ae.gains.join('\n') || '（无）'}
本月问题：
${ae.probs.join('\n') || '（无）'}
下月计划：结合阶段目标查漏补缺，强化薄弱科目。`;
    st.reviews.monthly.push({ id: APP.uid(), span: mk, created: U.todayStr(), content });
    APP.store.save(); APP.toast('已生成本月总结'); APP.refresh();
  }

  // ---------- helpers ----------
  // 大小周推算：基准 2026-08-03 = 大周（双休）；支持按周手动覆盖（st.weekTypeOverride[周一]）
  function weekTypeFor(d) {
    const ws = U.weekStart(d);
    const ov = (APP.store.get().weekTypeOverride || {})[ws];
    if (ov === '大周' || ov === '小周') return ov;
    const ref = U.weekStart('2026-08-03');
    const diff = Math.round((new Date(ws) - new Date(ref)) / (7 * 864e5));
    return (diff % 2 === 0) ? '大周' : '小周';
  }
  function majorityWeekType(ws, today) {
    let xw = 0, dw = 0; let d = ws;
    while (d <= today) {
      const t = (st.studyLog[d] || {}).weekType;
      if (t === '小周') xw++; else if (t === '大周') dw++;
      d = U.addDays(d, 1);
    }
    if (xw === 0 && dw === 0) return weekTypeFor(today);
    return xw >= dw ? '小周' : '大周';
  }
  function subjInput(label, input) {
    return APP.el('div', {}, [
      APP.el('div', { class: 'label', style: 'font-size:12px;margin-bottom:4px', text: label }),
      input
    ]);
  }
};

  // ---------- P5 图表实现（原生 SVG，无外部库）----------
  function svgEl(tag, attrs, children) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if (attrs) for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, String(attrs[k]));
    (children || []).forEach(c => c && e.appendChild(c));
    return e;
  }
  function svgTxt(s) { return document.createTextNode(s); }
  function parseD(s) { return new Date(s + 'T00:00:00'); }
  function mondayOf(dt) { const d = new Date(dt); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); d.setHours(0, 0, 0, 0); return d; }
  function fmtDate(dt) { const y = dt.getFullYear(); const m = String(dt.getMonth() + 1).padStart(2, '0'); const dd = String(dt.getDate()).padStart(2, '0'); return y + '-' + m + '-' + dd; }

  function checkedDaysCount() {
    return Object.keys(st.studyLog || {}).filter(d => {
      const l = st.studyLog[d] || {};

    }).length;

  // 1) 各科周时长堆叠柱状图（按时间范围：本周/本月/全部）
  function weeklyStackedBar() {
    const titleMap = { week: '本周各科时长（小时）', month: '本月各学科周时长（小时/周）', all: '全部各学科周时长（小时/周）' };
    const card = APP.el('div', { class: 'card' }, [APP.el('div', { class: 'sec-title', text: titleMap[daPeriod] || '各科周时长堆叠' })]);
    const subs = ['数学一', '408', '英语一', '政治'];
    const smKeys = { '数学一': 'math', '408': 'cs', '英语一': 'eng', '政治': 'pol' };
    const curMon = mondayOf(parseD(today));
    let weeks = [];
    if (daPeriod === 'week') {
      weeks = [curMon]; // 仅本周
    } else if (daPeriod === 'month') {
      const y = today.slice(0, 4), mo = today.slice(5, 7);
      const firstD = parseD(y + '-' + mo + '-01');
      const lastD = parseD(y + '-' + mo + '-' + new Date(Number(y), Number(mo), 0).getDate());
      let d = mondayOf(firstD);
      while (d <= lastD) { weeks.push(new Date(d)); d.setDate(d.getDate() + 7); }
    } else {
      let d = mondayOf(parseD('2026-08-03'));
      const end = parseD(today);
      while (d <= end) { weeks.push(new Date(d)); d.setDate(d.getDate() + 7); }
    }
    let any = false;
    const weekData = weeks.map(m => {
      const sums = { '数学一': 0, '408': 0, '英语一': 0, '政治': 0 };
      for (let k = 0; k < 7; k++) {
        const d = new Date(m); d.setDate(m.getDate() + k);
        const sm = (st.studyLog[fmtDate(d)] || {}).subjectMin || {};
        subs.forEach(s => { const v = Number(sm[smKeys[s]]) || 0; sums[s] += v; if (v > 0) any = true; });
      }
      return sums;
    });
    if (!any) { card.appendChild(APP.el('div', { class: 'empty', text: '暂无打卡数据，打卡后这里会显示图表（已打卡 ' + checkedDaysCount() + ' 天）' })); return card; }
    let maxH = 0; weekData.forEach(w => { let t = 0; subs.forEach(s => t += w[s]); maxH = Math.max(maxH, t); });
    maxH = maxH / 60;
    const scaleMax = Math.max(45, Math.ceil(maxH / 10) * 10);
    const W = 680, H = 250, padL = 40, padR = 10, padT = 14, padB = 26;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const yOf = h => padT + (1 - h / scaleMax) * plotH;
    const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, style: 'width:100%;height:auto;display:block' });
    // 目标线 41h / 33h
    [41, 33].forEach(g => {
      if (g <= scaleMax) {
        const y = yOf(g);
        svg.appendChild(svgEl('line', { x1: padL, y1: y, x2: W - padR, y2: y, stroke: '#B14B5E', 'stroke-dasharray': '4 4', 'stroke-width': 1, opacity: .7 }));
        svg.appendChild(svgEl('text', { x: W - padR, y: y - 3, 'text-anchor': 'end', 'font-size': 10, fill: '#B14B5E' }, [svgTxt('目标' + g + 'h')]));
      }
    });
    for (let g = 0; g <= scaleMax; g += 10) {
      const y = yOf(g);
      svg.appendChild(svgEl('line', { x1: padL, y1: y, x2: W - padR, y2: y, stroke: '#E3E5E1', 'stroke-width': 1 }));
      svg.appendChild(svgEl('text', { x: padL - 5, y: y + 3, 'text-anchor': 'end', 'font-size': 9, fill: '#9aa' }, [svgTxt(g + '')]));
    }
    const slot = plotW / Math.max(1, weeks.length), bw = Math.min(46, slot - 10);
    weekData.forEach((w, i) => {
      const cx = padL + slot * i + slot / 2;
      let acc = 0;
      subs.forEach(s => {
        const h = w[s] / 60;
        if (h > 0) {
          const yTop = yOf(acc + h), yBot = yOf(acc);
          svg.appendChild(svgEl('rect', { x: cx - bw / 2, y: yTop, width: bw, height: Math.max(1, yBot - yTop), fill: APP.SUBJECT_COLORS[s], rx: 2 }));
          acc += h;
        }
      });
      svg.appendChild(svgEl('text', { x: cx, y: yOf(acc) - 4, 'text-anchor': 'middle', 'font-size': 10, fill: '#18202B', 'font-weight': 600 }, [svgTxt((acc).toFixed(1))]));
      const mLbl = (weeks[i].getMonth() + 1) + '/' + weeks[i].getDate();
      svg.appendChild(svgEl('text', { x: cx, y: H - 8, 'text-anchor': 'middle', 'font-size': 9, fill: '#9aa' }, [svgTxt(mLbl)]));
    });
    card.appendChild(svg);
    const leg = APP.el('div', { class: 'row', style: 'gap:14px;margin-top:8px;flex-wrap:wrap' });
    subs.forEach(s => leg.appendChild(APP.el('div', { class: 'row', style: 'gap:6px;align-items:center' }, [
      APP.el('span', { style: 'width:12px;height:12px;border-radius:3px;display:inline-block;background:' + APP.SUBJECT_COLORS[s] }),
      APP.el('span', { class: 'muted', style: 'font-size:12px', text: s })
    ])));
    card.appendChild(leg);
    return card;
  }

  // 2) 单词曲线（按时间范围，新词/旧词）
  function wordCurve() {
    const card = APP.el('div', { class: 'card' }, [APP.el('div', { class: 'sec-title', text: '单词曲线（' + periodLabel[daPeriod] + '，新词 / 旧词）' })]);
    const days = []; let any = false;

    let maxV = 1; days.forEach(x => maxV = Math.max(maxV, x.wn, x.wo));
    maxV = Math.ceil(maxV / 10) * 10;
    const W = 680, H = 220, padL = 34, padR = 10, padT = 12, padB = 22;

    const xOf = i => padL + (days.length === 1 ? plotW / 2 : i / (days.length - 1) * plotW);

    const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, style: 'width:100%;height:auto;display:block' });
    for (let g = 0; g <= maxV; g += 10) { const y = yOf(g); svg.appendChild(svgEl('line', { x1: padL, y1: y, x2: W - padR, y2: y, stroke: '#E3E5E1' })); svg.appendChild(svgEl('text', { x: padL - 4, y: y + 3, 'text-anchor': 'end', 'font-size': 9, fill: '#9aa' }, [svgTxt(g + '')])); }
    const lineFor = key => {

      return svgEl('polyline', { points: pts.join(' '), fill: 'none', stroke: key === 'wn' ? '#93A4C1' : '#B14B5E', 'stroke-width': 2 });
    };
    svg.appendChild(lineFor('wo'));
    svg.appendChild(lineFor('wn'));
    days.forEach((x, i) => { if (x.wn) svg.appendChild(svgEl('circle', { cx: xOf(i), cy: yOf(x.wn), r: 2.2, fill: '#93A4C1' })); if (x.wo) svg.appendChild(svgEl('circle', { cx: xOf(i), cy: yOf(x.wo), r: 2.2, fill: '#B14B5E' })); });
    card.appendChild(svg);
    card.appendChild(APP.el('div', { class: 'row', style: 'gap:14px;margin-top:6px' }, [
      APP.el('div', { class: 'row', style: 'gap:6px;align-items:center' }, [APP.el('span', { style: 'width:12px;height:3px;background:#93A4C1;display:inline-block' }), APP.el('span', { class: 'muted', style: 'font-size:12px', text: '新词' })]),
      APP.el('div', { class: 'row', style: 'gap:6px;align-items:center' }, [APP.el('span', { style: 'width:12px;height:3px;background:#B14B5E;display:inline-block' }), APP.el('span', { class: 'muted', style: 'font-size:12px', text: '旧词复习' })])
    ]));
    return card;
  }

  // 3) 正确率曲线（按时间范围，数学一 / 专业课，做题数为0的天跳过）
  function accuracyCurve() {
    const card = APP.el('div', { class: 'card' }, [APP.el('div', { class: 'sec-title', text: '正确率曲线（' + periodLabel[daPeriod] + '，数学一 / 专业课）' })]);
    const days = []; let any = false;

      const cd = Number(log.csDone) || 0, cw = Number(log.csWrong) || 0;
      const mAcc = md > 0 ? (md - mw) / md * 100 : null;
      const cAcc = cd > 0 ? (cd - cw) / cd * 100 : null;
      if (mAcc != null || cAcc != null) any = true;
      days.push({ mAcc, cAcc });
    });
    if (!any) { card.appendChild(APP.el('div', { class: 'empty', text: '暂无做题数据，打卡后这里会显示图表（已打卡 ' + checkedDaysCount() + ' 天）' })); return card; }
    const W = 680, H = 220, padL = 34, padR = 10, padT = 12, padB = 22;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const xOf = i => padL + (days.length === 1 ? plotW / 2 : i / (days.length - 1) * plotW);
    const yOf = v => padT + (1 - v / 100) * plotH;
    const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, style: 'width:100%;height:auto;display:block' });
    for (let g = 0; g <= 100; g += 20) { const y = yOf(g); svg.appendChild(svgEl('line', { x1: padL, y1: y, x2: W - padR, y2: y, stroke: '#E3E5E1' })); svg.appendChild(svgEl('text', { x: padL - 4, y: y + 3, 'text-anchor': 'end', 'font-size': 9, fill: '#9aa' }, [svgTxt(g + '%')])); }
    const drawAcc = (key, color) => {

      days.forEach((x, i) => { const v = x[key]; if (v == null) { flush(); return; } seg.push(xOf(i) + ',' + yOf(v)); });
      flush();
    };
    drawAcc('mAcc', '#18202B');
    drawAcc('cAcc', '#93A4C1');
    card.appendChild(svg);
    card.appendChild(APP.el('div', { class: 'row', style: 'gap:14px;margin-top:6px' }, [
      APP.el('div', { class: 'row', style: 'gap:6px;align-items:center' }, [APP.el('span', { style: 'width:12px;height:3px;background:#18202B;display:inline-block' }), APP.el('span', { class: 'muted', style: 'font-size:12px', text: '数学一' })]),
      APP.el('div', { class: 'row', style: 'gap:6px;align-items:center' }, [APP.el('span', { style: 'width:12px;height:3px;background:#93A4C1;display:inline-block' }), APP.el('span', { class: 'muted', style: 'font-size:12px', text: '专业课' })])
    ]));

  }

  function updateView() {
    if (!refs) return;
    const t = s.mode === 'down' ? s.remaining : s.elapsed;
    if (timeDisplay && durInput && durInput.style.display !== 'block') timeDisplay.textContent = fmt(t);
    refs.root.querySelectorAll('.pomo-mode').forEach(b => b.classList.toggle('on', b.getAttribute('data-m') === s.mode));
    const tog = document.getElementById('pomo-toggle');
    if (tog) tog.textContent = s.running ? '暂停' : '开始';
  }

  function start() {
    if (s.running) return;
    if (s.mode === 'down' && s.remaining <= 0) reset();
    s.running = true;
    s.iv = setInterval(tick, 1000);
    updateView();
  }
  function pause() {
    s.running = false;
    if (s.iv) { clearInterval(s.iv); s.iv = null; }
    record();
    updateView();
  }
  function toggle() { s.running ? pause() : start(); }
  function reset() {
    if (s.running) record();
    s.running = false;
    if (s.iv) { clearInterval(s.iv); s.iv = null; }
    if (s.mode === 'down') s.remaining = s.durMin * 60; else s.elapsed = 0;
    updateView();
    APP.toast('计时已重置');
  }
  function tick() {
    if (s.mode === 'down') {
      s.remaining--;
      if (s.remaining <= 0) { s.remaining = 0; updateView(); pause(); APP.toast('倒计时结束，已记录学习时长'); return; }
    } else {
      s.elapsed++;
    }
    updateView();
  }
  function setMode(m) {
    s.mode = m; reset();
  }
  function setDur(v) {
    s.durMin = Math.min(180, Math.max(1, v || 25));
    if (s.mode === 'down' && !s.running) s.remaining = s.durMin * 60;
    updateView();
  }
  function record() {
    const sec = elapsedSec();
    const min = Math.round(sec / 60);
    if (min <= 0) return;
    const st = APP.store.get();
    const today = APP.util.todayStr();
    st.studyLog[today] = st.studyLog[today] || {};
    st.studyLog[today].minutes = (Number(st.studyLog[today].minutes) || 0) + min;
    const fid = focusTaskId();
    let taskText = '';
    if (fid) {
      const t = (st.todayTasks[today] || []).find(x => x.id === fid);
      if (t) { t.spent = (Number(t.spent) || 0) + min; taskText = ' · ' + t.subject + '/' + t.text; }
    }
    APP.store.save();
    APP.toast('番茄钟：已记录 ' + min + ' 分钟' + taskText);
    if (APP.updateTopbar) APP.updateTopbar();
    if (APP._navigate && (APP.current === 'dashboard' || APP.current === 'review')) APP.refresh();
  }

  APP.initTimer = function () {
    if (document.getElementById('pomo-root')) return;
    ensure();
    build();
    updateView();
  };
  APP.focusTask = function (id) {
    APP._focusTaskId = id;
    buildFocusOptions();
  };
  APP.refreshTimerFocus = function () { if (refs) buildFocusOptions(); };
})(APP);

window.APP = window.APP || {};
(function (APP) {
  const REMOTE_PATH = '/408-workbench-backup.json';
  let uploadTimer = null;

  function getCfg() {
    const st = APP.store.get();
    return st.settings && st.settings.webdav || {};
  }
  function setCfg(patch) {
    const st = APP.store.get();
    st.settings = st.settings || {};
    st.settings.webdav = Object.assign({}, st.settings.webdav, patch);
    APP.store.save();
  }
  function authHeader(user, pass) {
    return 'Basic ' + btoa(unescape(encodeURIComponent(user + ':' + pass)));
  }

  function buildRequest(cfg, method, body) {
    const realUrl = cfg.url.replace(/\/$/, '') + REMOTE_PATH;
    const useProxy = !!(cfg.proxyUrl && cfg.proxyUrl.trim());
    const fetchUrl = useProxy ? cfg.proxyUrl.replace(/\/$/, '') : realUrl;
    const headers = {};
    if (useProxy) {
      headers['X-WebDAV-Url'] = realUrl;
      headers['X-WebDAV-Auth'] = authHeader(cfg.user, cfg.pass);
    } else {
      headers['Authorization'] = authHeader(cfg.user, cfg.pass);
    }
    if (method === 'PUT') headers['Content-Type'] = 'application/json';
    const init = { method, headers };
    if (body !== undefined) init.body = body;
    return { fetchUrl, init };
  }

  // 上传当前状态到坚果云
  APP.syncUpload = async function (opts) {
    const cfg = getCfg();
    if (!cfg.enabled || !cfg.url || !cfg.user || !cfg.pass) return { ok: false, msg: 'WebDAV 未配置' };
    const data = APP.store.exportJSON();
    const { fetchUrl, init } = buildRequest(cfg, 'PUT', data);
    console.log('[sync upload] fetchUrl:', fetchUrl, 'method:', init.method, 'headers:', Object.keys(init.headers));
    try {
      const res = await fetch(fetchUrl, init);
      console.log('[sync upload] response status:', res.status);
      if (res.ok || res.status === 201 || res.status === 204) {
        const now = APP.util.todayStr() + ' ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        setCfg({ lastSync: now, lastSyncStatus: '成功' });
        if (opts && opts.silent) return { ok: true };
        APP.toast('☁ 已同步到坚果云');
        return { ok: true };
      }
      const msg = '同步失败 HTTP ' + res.status;
      setCfg({ lastSyncStatus: msg });
      return { ok: false, msg };
    } catch (e) {
      console.error('[sync upload] error:', e);
      const msg = '同步失败：' + (e.message || '网络错误');
      setCfg({ lastSyncStatus: msg });
      return { ok: false, msg };
    }
  };

  // 从坚果云下载
  APP.syncDownload = async function (opts) {
    const cfg = getCfg();
    if (!cfg.enabled || !cfg.url || !cfg.user || !cfg.pass) return { ok: false, msg: 'WebDAV 未配置' };
    const { fetchUrl, init } = buildRequest(cfg, 'GET');
    console.log('[sync download] fetchUrl:', fetchUrl, 'method:', init.method, 'headers:', Object.keys(init.headers));
    try {
      const res = await fetch(fetchUrl, init);
      console.log('[sync download] response status:', res.status);
      if (res.status === 404) return { ok: false, msg: '云端暂无备份' };
      if (!res.ok) return { ok: false, msg: '下载失败 HTTP ' + res.status };
      const text = await res.text();
      const remote = JSON.parse(text);
      const local = APP.store.get();
      const localTime = local.meta && local.meta._syncTime ? local.meta._syncTime : '';
      const remoteTime = remote.meta && remote.meta._syncTime ? remote.meta._syncTime : '';
      // 无冲突直接覆盖
      if (!remoteTime || (localTime && localTime >= remoteTime)) {
        // 本地更新，无需覆盖
        return { ok: true, action: 'noop', msg: '本地已是最新' };
      }
      // 有更新
      if (opts && opts.auto && !opts.force) {
        // 自动模式下提示冲突
        return { ok: true, action: 'conflict', remote, msg: '发现云端更新' };
      }
      // 强制覆盖本地
      APP.store.importJSON(text);
      APP.toast('☁ 已从坚果云恢复数据');
      return { ok: true, action: 'restored', msg: '已恢复' };
    } catch (e) {
      console.error('[sync download] error:', e);
      return { ok: false, msg: '下载失败：' + (e.message || '网络错误') };
    }
  };

  // 防抖自动上传
  APP.syncAutoUpload = function () {
    const cfg = getCfg();
    if (!cfg.enabled) return;
    if (uploadTimer) clearTimeout(uploadTimer);
    uploadTimer = setTimeout(() => {
      APP.syncUpload({ silent: true });
    }, 3000);
  };

  // 打开冲突解决弹窗
  APP.syncResolveConflict = function (remote) {
    const local = APP.store.get();
    const localTime = (local.meta && local.meta._syncTime) || '未知';
    const remoteTime = (remote.meta && remote.meta._syncTime) || '未知';
    const body = APP.el('div', {}, [
      APP.el('div', { style: 'font-size:13px;margin-bottom:12px', text: '本地和云端数据不一致，请选择保留哪一份：' }),
      APP.el('div', { class: 'card', style: 'margin-bottom:10px;padding:10px' }, [
        APP.el('div', { style: 'font-weight:600;margin-bottom:4px', text: '本地数据' }),
        APP.el('div', { class: 'muted', style: 'font-size:12px', text: '最后同步：' + localTime })
      ]),
      APP.el('div', { class: 'card', style: 'margin-bottom:10px;padding:10px' }, [
        APP.el('div', { style: 'font-weight:600;margin-bottom:4px', text: '云端数据' }),
        APP.el('div', { class: 'muted', style: 'font-size:12px', text: '最后同步：' + remoteTime })
      ])
    ]);
    APP.openModal('同步冲突', body, [
      APP.el('button', { class: 'btn', text: '取消', onclick: APP.closeModal }),
      APP.el('button', { class: 'btn danger', text: '保留云端（覆盖本地）', onclick: () => {
        try { APP.store.importJSON(JSON.stringify(remote)); APP.toast('已覆盖为云端数据'); } catch (e) { APP.toast('覆盖失败'); }
        APP.closeModal(); APP.refresh();
      } }),
      APP.el('button', { class: 'btn primary', text: '保留本地（覆盖云端）', onclick: () => {
        APP.syncUpload({ silent: false });
        APP.closeModal();
      } })
    ]);
  };
})(APP);
